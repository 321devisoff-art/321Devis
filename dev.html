<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Développement — 321Devis</title>
    <style>
        *{box-sizing:border-box}
        :root{--blue:#2864e8;--ink:#101828;--muted:#667085;--line:#e5eaf2;--bg:#f5f7fb;--white:#fff;--green:#067647;--red:#b42318}
        body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
        .container{max-width:760px;margin:auto;padding:36px 20px}
        .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(16,24,40,.055)}
        h1{margin:0 0 8px;font-size:28px}
        p{color:var(--muted);line-height:1.5}
        .warning{background:#fffaeb;border:1px solid #fedf89;border-radius:10px;padding:12px 14px;color:#93370d;font-size:13px;margin:18px 0}
        button{border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:750;padding:12px 16px;cursor:pointer;font-size:14px}
        button:disabled{opacity:.55;cursor:not-allowed}
        .resultat{display:none;margin-top:18px;padding:15px;border-radius:10px;background:#ecfdf3;color:var(--green);font-weight:700}
        .erreur{display:none;margin-top:18px;padding:15px;border-radius:10px;background:#fef3f2;color:var(--red);white-space:pre-wrap}
        a{color:var(--blue);font-weight:700}
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Mode développement 321Devis</h1>
        <p>Cette page sert uniquement à accélérer les tests pendant le développement.</p>

        <div class="warning">
            Accès réservé au compte développeur. La fonction Supabase vérifie également le compte côté serveur.
            Cette page devra être supprimée avant la mise en production.
        </div>

        <button id="btnDevis" type="button" onclick="creerDevisTest()">
            Créer un devis test « À valider »
        </button>

        <div id="resultat" class="resultat"></div>
        <div id="erreur" class="erreur"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ywmuiqavjdzuaittqesc.supabase.co";
const SUPABASE_KEY = "sb_publishable_TiG6CaYzFOPjZ8JJSHRI_w_mZd8Kmpv";
const DEV_USER_ID = "fa6be41e-2107-4838-b9a3-fc26b92d53eb";

const clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let accessToken = null;

async function verifierAcces() {
    const { data, error } = await clientSupabase.auth.getSession();

    if (error) throw error;

    if (!data?.session?.user) {
        window.location.href = "connexion.html";
        return false;
    }

    if (data.session.user.id !== DEV_USER_ID) {
        document.body.innerHTML =
            '<div class="container"><div class="card"><h1>Accès interdit</h1><p>Cette page est réservée au développement.</p></div></div>';
        return false;
    }

    accessToken = data.session.access_token;
    return true;
}

async function creerDevisTest() {
    const bouton = document.getElementById("btnDevis");
    const resultat = document.getElementById("resultat");
    const erreur = document.getElementById("erreur");

    bouton.disabled = true;
    bouton.textContent = "Création…";
    resultat.style.display = "none";
    erreur.style.display = "none";

    try {
        const reponse = await fetch(SUPABASE_URL + "/rest/v1/rpc/dev_creer_devis_test", {
            method: "POST",
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + accessToken,
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({})
        });

        const texte = await reponse.text();
        let donnees = null;

        try {
            donnees = texte ? JSON.parse(texte) : null;
        } catch (_) {
            donnees = texte;
        }

        if (!reponse.ok) {
            const message = donnees?.message || donnees?.error || texte || ("Erreur HTTP " + reponse.status);
            throw new Error(message);
        }

        const ligne = Array.isArray(donnees) ? donnees[0] : donnees;

        if (!ligne?.numero_devis) {
            throw new Error("Le devis a été créé, mais son numéro n'a pas été retourné.");
        }

        resultat.innerHTML =
            '✓ ' + echapperHTML(ligne.numero_devis) +
            ' créé. <a href="validation-devis.html?numero=' +
            encodeURIComponent(ligne.numero_devis) +
            '">Ouvrir directement le devis</a>';
        resultat.style.display = "block";

    } catch (e) {
        console.error(e);
        erreur.textContent = "Impossible de créer le devis test.\n\n" + e.message;
        erreur.style.display = "block";
    } finally {
        bouton.disabled = false;
        bouton.textContent = 'Créer un devis test « À valider »';
    }
}

function echapperHTML(v) {
    return String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

document.addEventListener("DOMContentLoaded", async () => {
    try {
        await verifierAcces();
    } catch (e) {
        console.error(e);
        document.getElementById("erreur").textContent =
            "Impossible de vérifier l'accès.\n\n" + e.message;
        document.getElementById("erreur").style.display = "block";
    }
});
</script>
</body>
</html>
