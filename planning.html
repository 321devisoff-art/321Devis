<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planning - 321Devis</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #101828;
    }

    a {
      color: inherit;
    }

    .layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 230px 1fr;
    }

    .sidebar {
      background: #ffffff;
      border-right: 1px solid #e4e7ec;
      padding: 26px 18px;
    }

    .logo {
      display: inline-block;
      margin: 0 10px 30px;
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
      color: #101828;
    }

    .logo span {
      color: #2563eb;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav a {
      text-decoration: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-weight: 700;
      color: #475467;
    }

    .nav a:hover,
    .nav a.active {
      background: #eff4ff;
      color: #175cd3;
    }

    .main {
      padding: 32px;
    }

    .topbar {
      max-width: 1100px;
      margin: 0 auto 24px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.15;
    }

    .subtitle {
      margin: 0;
      color: #667085;
      line-height: 1.5;
    }

    .content {
      max-width: 1100px;
      margin: 0 auto;
    }

    .status {
      padding: 18px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid #e4e7ec;
      color: #475467;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.04);
    }

    .status.error {
      border-color: #fecdca;
      background: #fff6f5;
      color: #b42318;
    }

    .day-section {
      margin-bottom: 28px;
    }

    .day-title {
      margin: 0 0 12px;
      font-size: 18px;
      color: #344054;
      text-transform: capitalize;
    }

    .appointments {
      display: grid;
      gap: 14px;
    }

    .appointment {
      background: #ffffff;
      border: 1px solid #e4e7ec;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.04);
    }

    .appointment-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .appointment-time {
      font-size: 22px;
      font-weight: 800;
      color: #101828;
    }

    .appointment-client {
      margin-top: 5px;
      font-size: 18px;
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 7px 11px;
      background: #ecfdf3;
      color: #027a48;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 22px;
    }

    .detail {
      min-width: 0;
    }

    .label {
      margin-bottom: 4px;
      color: #667085;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .value {
      color: #101828;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .value.muted {
      color: #667085;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #eaecf0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      text-decoration: none;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-secondary {
      background: #f2f4f7;
      color: #344054;
    }

    .btn-finish { background: #039855; color: #ffffff; }
    .btn:disabled { opacity: 0.65; cursor: wait; }
    .finished-note {
      display: inline-flex; align-items: center; min-height: 42px;
      padding: 10px 14px; border-radius: 9px; background: #ecfdf3;
      color: #027a48; font-weight: 800;
    }

    .empty {
      background: #ffffff;
      border: 1px dashed #d0d5dd;
      border-radius: 16px;
      padding: 42px 24px;
      text-align: center;
      color: #667085;
    }

    .empty strong {
      display: block;
      color: #101828;
      margin-bottom: 8px;
      font-size: 18px;
    }

    @media (max-width: 820px) {
      .layout {
        display: block;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid #e4e7ec;
        padding: 16px;
      }

      .logo {
        margin: 0 0 14px;
      }

      .nav {
        display: flex;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .nav a {
        white-space: nowrap;
      }

      .main {
        padding: 22px 16px 36px;
      }

      .topbar {
        display: block;
      }

      h1 {
        font-size: 28px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .appointment-head {
        display: block;
      }

      .badge {
        margin-top: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="layout">

    <aside class="sidebar">
      <a class="logo" href="index.html"><span>321</span>Devis</a>

      <nav class="nav">
        <a href="index.html">Accueil</a>
        <a href="demandes.html">Demandes</a>
        <a href="historique.html">Devis</a>
        <a href="planning.html" class="active">Planning</a>
        <a href="factures.html">Factures</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="parametres.html">Paramètres</a>
      </nav>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>Planning</h1>
          <p class="subtitle">
            Vos interventions confirmées apparaissent automatiquement ici.
          </p>
        </div>
      </div>

      <div id="content" class="content">
        <div class="status">Chargement du planning…</div>
      </div>
    </main>

  </div>

  <script>
    const SUPABASE_URL = "https://ywmuiqavjdzuaittqesc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TiG6CaYzFOPjZ8JJSHRI_w_mZd8Kmpv";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const content = document.getElementById("content");

    let accessToken = null;
    let userId = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDay(value) {
      return new Intl.DateTimeFormat("fr-FR", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      }).format(new Date(value));
    }

    function formatTime(value) {
      return new Intl.DateTimeFormat("fr-FR", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(value));
    }

    function formatRange(start, end) {
      const startText = formatTime(start);

      if (!end) {
        return startText;
      }

      return `${startText} – ${formatTime(end)}`;
    }

    function phoneHref(phone) {
      return String(phone || "").replace(/[^\d+]/g, "");
    }

    async function api(path) {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/${path}`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${accessToken}`,
            Accept: "application/json"
          }
        }
      );

      const data = await response.json().catch(() => null);

      if (!response.ok) {
        const message =
          data?.message ||
          data?.error ||
          data?.details ||
          "Erreur Supabase.";

        throw new Error(message);
      }

      return data;
    }

    async function requireAuth() {
      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = "connexion.html";
        return false;
      }

      accessToken = session.access_token;
      userId = session.user.id;
      return true;
    }

    async function rpc(functionName, body) {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/${functionName}`,
        {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${accessToken}`,
            "Content-Type": "application/json",
            Accept: "application/json"
          },
          body: JSON.stringify(body)
        }
      );
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        throw new Error(data?.message || data?.error || data?.details || "Impossible d'effectuer cette action.");
      }
      return data;
    }

    async function terminerIntervention(rendezVousId, button) {
      if (!window.confirm("Confirmer que cette intervention est terminée ?")) return;
      const originalText = button.textContent;
      try {
        button.disabled = true;
        button.textContent = "Enregistrement…";
        const resultatIntervention = await rpc(
          "terminer_intervention",
          { p_rendez_vous_id: rendezVousId }
        );

        const intervention = Array.isArray(resultatIntervention)
          ? resultatIntervention[0]
          : resultatIntervention;

        const devisId = intervention?.devis_id;

        if (!devisId) {
          throw new Error(
            "Intervention terminée, mais le devis associé est introuvable."
          );
        }

        let facture;

        try {
          const resultatFacture = await rpc(
            "creer_facture_depuis_devis",
            { p_devis_id: devisId }
          );

          facture = Array.isArray(resultatFacture)
            ? resultatFacture[0]
            : resultatFacture;
        } catch (factureError) {
          console.error(factureError);

          await loadPlanning();

          alert(
            "L'intervention est bien terminée, mais la facture n'a pas pu être préparée automatiquement : " +
            (factureError instanceof Error
              ? factureError.message
              : "erreur inconnue.")
          );

          return;
        }

        await loadPlanning();

        const numeroFacture =
          facture?.numero_facture ||
          "la facture";

        alert(
          `Intervention terminée. ${numeroFacture} a été préparée automatiquement et attend votre validation.`
        );

        if (facture?.facture_id) {
          window.location.href =
            `voir-facture.html?id=${encodeURIComponent(facture.facture_id)}`;
        } else {
          window.location.href = "factures.html";
        }
      } catch (error) {
        console.error(error);
        button.disabled = false;
        button.textContent = originalText;
        alert(error instanceof Error ? error.message : "Impossible de terminer l'intervention.");
      }
    }

    async function loadPlanning() {
      try {
        const ok = await requireAuth();

        if (!ok) {
          return;
        }

        const appointments = await api(
          `rendez_vous` +
          `?select=id,devis_id,client_id,debut,fin,statut,intervention_terminee,date_intervention_terminee` +
          `&user_id=eq.${encodeURIComponent(userId)}` +
          `&statut=eq.${encodeURIComponent("Confirmé")}` +
          `&order=debut.asc`
        );

        if (!appointments.length) {
          content.innerHTML = `
            <div class="empty">
              <strong>Aucun rendez-vous confirmé</strong>
              Dès qu'un client choisit un créneau, l'intervention apparaîtra ici automatiquement.
            </div>
          `;
          return;
        }

        const devisIds = [...new Set(
          appointments.map(item => item.devis_id).filter(Boolean)
        )];

        const clientIds = [...new Set(
          appointments.map(item => item.client_id).filter(Boolean)
        )];

        const devisFilter = devisIds.map(id => `"${id}"`).join(",");
        const clientFilter = clientIds.map(id => `"${id}"`).join(",");

        const [devisList, clientsList, lignesList] = await Promise.all([
          api(
            `devis` +
            `?select=id,numero,demande_id,statut` +
            `&user_id=eq.${encodeURIComponent(userId)}` +
            `&id=in.(${encodeURIComponent(devisFilter)})`
          ),
          api(
            `clients` +
            `?select=id,nom,email,telephone,adresse` +
            `&user_id=eq.${encodeURIComponent(userId)}` +
            `&id=in.(${encodeURIComponent(clientFilter)})`
          ),
          api(
            `lignes_devis` +
            `?select=devis_id,description,quantite` +
            `&user_id=eq.${encodeURIComponent(userId)}` +
            `&devis_id=in.(${encodeURIComponent(devisFilter)})` +
            `&order=created_at.asc`
          )
        ]);

        const demandeIds = [...new Set(
          devisList.map(item => item.demande_id).filter(Boolean)
        )];

        let demandesList = [];

        if (demandeIds.length) {
          const demandeFilter = demandeIds.map(id => `"${id}"`).join(",");

          demandesList = await api(
            `demandes` +
            `?select=id,description,adresse` +
            `&user_id=eq.${encodeURIComponent(userId)}` +
            `&id=in.(${encodeURIComponent(demandeFilter)})`
          );
        }

        const devisById = Object.fromEntries(
          devisList.map(item => [item.id, item])
        );

        const clientById = Object.fromEntries(
          clientsList.map(item => [item.id, item])
        );

        const demandeById = Object.fromEntries(
          demandesList.map(item => [item.id, item])
        );

        const linesByDevis = {};

        for (const line of lignesList) {
          if (!linesByDevis[line.devis_id]) {
            linesByDevis[line.devis_id] = [];
          }

          linesByDevis[line.devis_id].push(line);
        }

        const groups = new Map();

        for (const appointment of appointments) {
          const key = new Date(appointment.debut)
            .toISOString()
            .slice(0, 10);

          if (!groups.has(key)) {
            groups.set(key, []);
          }

          groups.get(key).push(appointment);
        }

        content.innerHTML = [...groups.entries()]
          .map(([dayKey, items]) => {
            const dayTitle = formatDay(items[0].debut);

            const cards = items.map(appointment => {
              const devis = devisById[appointment.devis_id] || {};
              const client = clientById[appointment.client_id] || {};
              const demande = demandeById[devis.demande_id] || {};
              const lines = linesByDevis[appointment.devis_id] || [];

              const intervention =
                demande.description ||
                lines
                  .map(line => line.description)
                  .filter(Boolean)
                  .join(", ") ||
                "Intervention";

              const address =
                demande.adresse ||
                client.adresse ||
                "Adresse non renseignée";

              const phone = client.telephone || "";
              const email = client.email || "";

              return `
                <article class="appointment">
                  <div class="appointment-head">
                    <div>
                      <div class="appointment-time">
                        ${escapeHtml(formatRange(appointment.debut, appointment.fin))}
                      </div>

                      <div class="appointment-client">
                        ${escapeHtml(client.nom || "Client")}
                      </div>
                    </div>

                    <span class="badge">
                      ${escapeHtml(appointment.statut || "Confirmé")}
                    </span>
                  </div>

                  <div class="details">
                    <div class="detail">
                      <div class="label">Intervention</div>
                      <div class="value">
                        ${escapeHtml(intervention)}
                      </div>
                    </div>

                    <div class="detail">
                      <div class="label">Devis accepté</div>
                      <div class="value">
                        ${escapeHtml(devis.numero || "—")}
                      </div>
                    </div>

                    <div class="detail">
                      <div class="label">Adresse</div>
                      <div class="value">
                        ${escapeHtml(address)}
                      </div>
                    </div>

                    <div class="detail">
                      <div class="label">Téléphone</div>
                      <div class="value ${phone ? "" : "muted"}">
                        ${escapeHtml(phone || "Non renseigné")}
                      </div>
                    </div>

                    <div class="detail">
                      <div class="label">E-mail</div>
                      <div class="value ${email ? "" : "muted"}">
                        ${escapeHtml(email || "Non renseigné")}
                      </div>
                    </div>
                  </div>

                  <div class="actions">
                    ${
                      appointment.intervention_terminee
                        ? `<span class="finished-note">✅ Intervention terminée</span>`
                        : `<button class="btn btn-finish" type="button"
                            onclick="terminerIntervention('${escapeHtml(appointment.id)}', this)">
                            ✅ Intervention terminée
                           </button>`
                    }

                    ${
                      phone
                        ? `
                          <a
                            class="btn btn-primary"
                            href="tel:${escapeHtml(phoneHref(phone))}"
                          >
                            📞 Appeler le client
                          </a>
                        `
                        : ""
                    }

                    <a
                      class="btn btn-secondary"
                      href="voir-devis.html?id=${encodeURIComponent(appointment.devis_id)}"
                    >
                      Ouvrir le devis
                    </a>
                  </div>
                </article>
              `;
            }).join("");

            return `
              <section class="day-section">
                <h2 class="day-title">
                  ${escapeHtml(dayTitle)}
                </h2>

                <div class="appointments">
                  ${cards}
                </div>
              </section>
            `;
          })
          .join("");

      } catch (error) {
        console.error(error);

        content.innerHTML = `
          <div class="status error">
            ${escapeHtml(
              error instanceof Error
                ? error.message
                : "Impossible de charger le planning."
            )}
          </div>
        `;
      }
    }

    loadPlanning();
  </script>
</body>
</html>
