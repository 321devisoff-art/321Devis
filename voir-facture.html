<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voir la facture — 321Devis</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#fff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --blue:#2563eb;
      --green:#16a34a;
      --red:#dc2626;
      --orange:#ea580c;
      --shadow:0 10px 30px rgba(17,24,39,.06)
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text)
    }

    a{text-decoration:none;color:inherit}

    .app{
      min-height:100vh;
      display:grid;
      grid-template-columns:220px 1fr
    }

    aside{
      background:#fff;
      border-right:1px solid var(--border);
      padding:24px 16px
    }

    .brand{
      font-size:25px;
      font-weight:850;
      margin-bottom:30px
    }

    .brand span{color:var(--blue)}

    nav{
      display:flex;
      flex-direction:column;
      gap:8px
    }

    nav a{
      padding:12px 14px;
      border-radius:11px;
      font-weight:650;
      color:#374151
    }

    nav a.active{
      background:#111827;
      color:#fff
    }

    main{
      width:100%;
      max-width:1050px;
      margin:0 auto;
      padding:32px
    }

    .back{
      display:inline-block;
      margin-bottom:18px;
      color:#4b5563;
      font-weight:650
    }

    .head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
      margin-bottom:22px
    }

    h1{
      margin:0 0 7px;
      font-size:30px
    }

    .muted{color:var(--muted)}

    .badge{
      display:inline-block;
      padding:7px 11px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      background:#fff7ed;
      color:#c2410c
    }

    .badge-validee,
    .badge-envoyee{
      background:#eff6ff;
      color:#1d4ed8
    }

    .badge-payee{
      background:#ecfdf5;
      color:#15803d
    }

    .invoice{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:30px
    }

    .invoice-top{
      display:flex;
      justify-content:space-between;
      gap:30px;
      padding-bottom:25px;
      border-bottom:1px solid var(--border)
    }

    .company h2{margin:0 0 10px}

    .company p,
    .client p{
      margin:4px 0;
      color:#4b5563
    }

    .client{text-align:right}

    .client strong{
      display:block;
      margin-bottom:8px;
      color:#111827
    }

    .meta{
      display:flex;
      gap:35px;
      margin:24px 0
    }

    .meta div{
      color:var(--muted);
      font-size:13px
    }

    .meta strong{
      display:block;
      color:#111827;
      font-size:15px;
      margin-top:5px
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px
    }

    th,td{
      padding:14px 10px;
      border-bottom:1px solid var(--border);
      text-align:left
    }

    th{
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase
    }

    th:nth-child(n+2),
    td:nth-child(n+2){
      text-align:right
    }

    .totals{
      margin-left:auto;
      width:330px;
      margin-top:24px
    }

    .total-row{
      display:flex;
      justify-content:space-between;
      padding:8px 0
    }

    .total-row.ttc{
      font-size:20px;
      font-weight:850;
      border-top:2px solid #111827;
      margin-top:8px;
      padding-top:14px
    }

    .notice{
      margin-top:24px;
      padding:15px;
      border-radius:12px;
      background:#f9fafb;
      color:#4b5563;
      font-size:14px
    }

    .actions{
      display:flex;
      justify-content:flex-end;
      gap:12px;
      margin-top:22px
    }

    .btn{
      border:0;
      border-radius:11px;
      padding:12px 18px;
      font:inherit;
      font-weight:800;
      cursor:pointer
    }

    .btn-primary{
      background:#111827;
      color:#fff
    }

    .btn-primary:hover{opacity:.92}

    .btn-secondary{
      background:#f3f4f6;
      color:#111827
    }

    .btn-paid{
      background:#16a34a;
      color:#fff
    }

    .payment-box{
      margin-top:18px;
      padding:18px;
      border:1px solid var(--border);
      border-radius:14px;
      background:#f9fafb
    }

    .payment-box label{
      display:block;
      margin-bottom:7px;
      font-size:13px;
      font-weight:800
    }

    .payment-box select,
    .payment-box input{
      width:100%;
      padding:11px 12px;
      border:1px solid #d1d5db;
      border-radius:10px;
      background:#fff;
      font:inherit;
      margin-bottom:12px
    }

    .payment-info{
      margin-top:20px;
      padding:15px;
      border-radius:12px;
      background:#ecfdf5;
      color:#166534;
      font-size:14px;
      font-weight:700
    }

    .btn-primary:disabled,
    .btn-secondary:disabled,
    .btn-paid:disabled{
      opacity:.55;
      cursor:not-allowed
    }

    .success{
      margin-top:22px;
      padding:15px;
      border-radius:12px;
      background:#ecfdf5;
      color:#166534;
      font-size:14px;
      font-weight:700
    }

    .loading,
    .error{
      padding:50px;
      text-align:center;
      color:var(--muted)
    }

    .error{color:var(--red)}

    @media(max-width:800px){
      .app{display:block}
      aside{display:none}
      main{padding:20px 14px}
      .invoice{padding:20px}
      .invoice-top{display:block}
      .client{text-align:left;margin-top:25px}
      .meta{flex-wrap:wrap}
      .totals{width:100%}
      table{font-size:13px}
      .actions{display:block}
      .btn{width:100%}
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span>321</span>Devis</div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="demandes.html">Demandes</a>
      <a href="historique.html">Devis</a>
      <a href="planning.html">Planning</a>
      <a href="factures.html" class="active">Factures</a>
      <a href="catalogue.html">Catalogue</a>
      <a href="parametres.html">Paramètres</a>
    </nav>
  </aside>

  <main>
    <a class="back" href="factures.html">← Retour aux factures</a>
    <div id="content">
      <div class="loading">Chargement de la facture…</div>
    </div>
  </main>
</div>

<script>
const SUPABASE_URL = "https://ywmuiqavjdzuaittqesc.supabase.co";
const SUPABASE_KEY = "sb_publishable_TiG6CaYzFOPjZ8JJSHRI_w_mZd8Kmpv";

let accessToken = null;
let currentUser = null;
let factureActuelle = null;

function sessionLocale() {
  for (const key of Object.keys(localStorage).filter(
    k => k.startsWith("sb-") && k.endsWith("-auth-token")
  )) {
    try {
      const v = JSON.parse(localStorage.getItem(key));

      if (v?.access_token) return v;
      if (v?.currentSession?.access_token) return v.currentSession;
    } catch (e) {}
  }

  return null;
}

async function connexion() {
  const s = sessionLocale();

  if (!s?.access_token) {
    location.href = "connexion.html";
    return false;
  }

  accessToken = s.access_token;

  const r = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${accessToken}`
    }
  });

  if (!r.ok) {
    location.href = "connexion.html";
    return false;
  }

  currentUser = await r.json();
  return true;
}

async function get(path) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${accessToken}`
    }
  });

  if (!r.ok) {
    throw new Error(await r.text());
  }

  return r.json();
}

async function patch(path, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method: "PATCH",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${accessToken}`,
      "Content-Type": "application/json",
      Prefer: "return=representation"
    },
    body: JSON.stringify(body)
  });

  if (!r.ok) {
    throw new Error(await r.text());
  }

  return r.json();
}

function e(v) {
  return String(v ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function euro(v) {
  return new Intl.NumberFormat("fr-FR", {
    style: "currency",
    currency: "EUR"
  }).format(Number(v || 0));
}

function date(v) {
  return v
    ? new Intl.DateTimeFormat("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }).format(new Date(v))
    : "—";
}

function badgeClass(statut) {
  const s = String(statut || "").toLowerCase();

  if (s.includes("pay")) return "badge badge-payee";
  if (s.includes("envoy")) return "badge badge-envoyee";
  if (s.includes("valid")) return "badge badge-validee";

  return "badge";
}

function boutonAction(facture) {
  if (facture.statut === "Brouillon") {
    return `
      <div id="paymentBox" class="payment-box" style="display:none">
        <label for="moyenPaiement">Moyen de paiement reçu</label>
        <select id="moyenPaiement">
          <option value="">Choisir…</option>
          <option value="Espèces">Espèces</option>
          <option value="Chèque">Chèque</option>
          <option value="Carte bancaire">Carte bancaire</option>
          <option value="Virement">Virement</option>
        </select>

        <label for="paiementReference">Référence / note (facultatif)</label>
        <input
          id="paiementReference"
          type="text"
          maxlength="200"
          placeholder="Ex. chèque n°1234"
        >

        <button class="btn btn-paid" id="btnConfirmerPaiement" onclick="validerDejaPayee()">
          Confirmer : déjà payée et envoyer
        </button>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" type="button" onclick="ouvrirModificationFacture()">
          Modifier
        </button>

        <button class="btn btn-primary" id="btnValider" onclick="validerEtEnvoyerFacture()">
          Valider et envoyer — À payer
        </button>

        <button class="btn btn-paid" id="btnDejaPayee" onclick="afficherPaiementSurPlace()">
          Déjà payée sur place
        </button>
      </div>
    `;
  }

  if (facture.statut === "Validée") {
    return `
      <div class="actions">
        <button class="btn btn-primary" id="btnValider" onclick="envoyerFacture()">
          Envoyer la facture
        </button>
      </div>
    `;
  }

  if (facture.statut === "Envoyée") {
    return `
      <div class="success">
        Facture envoyée au client — paiement en attente.
      </div>
    `;
  }

  if (facture.statut === "Payée") {
    return `
      <div class="payment-info">
        Facture payée${facture.moyen_paiement ? ` — ${e(facture.moyen_paiement)}` : ""}
        ${facture.date_paiement ? ` le ${date(facture.date_paiement)}` : ""}.
      </div>
    `;
  }

  return "";
}

function afficherPaiementSurPlace() {
  const box = document.getElementById("paymentBox");
  if (!box) return;
  box.style.display = box.style.display === "none" ? "block" : "none";
  if (box.style.display === "block") {
    document.getElementById("moyenPaiement")?.focus();
  }
}

function ouvrirModificationFacture() {
  if (!factureActuelle) return;
  location.href = `modifier-facture.html?id=${encodeURIComponent(factureActuelle.id)}`;
}

async function charger() {
  const content = document.getElementById("content");

  try {
    if (!await connexion()) return;

    const id = new URLSearchParams(location.search).get("id");

    if (!id) {
      throw new Error("Identifiant de facture manquant.");
    }

    const uid = encodeURIComponent(currentUser.id);
    const fid = encodeURIComponent(id);

    const factures = await get(
      `factures?select=*&id=eq.${fid}&user_id=eq.${uid}&limit=1`
    );

    if (!factures.length) {
      throw new Error("Facture introuvable.");
    }

    const f = factures[0];
    factureActuelle = f;

    const [clients, lignes, parametres] = await Promise.all([
      get(
        `clients?select=*&id=eq.${encodeURIComponent(f.client_id)}&user_id=eq.${uid}&limit=1`
      ),
      get(
        `lignes_facture?select=*&facture_id=eq.${fid}&user_id=eq.${uid}&order=created_at.asc`
      ),
      get(
        `parametres?select=*&user_id=eq.${uid}&limit=1`
      )
    ]);

    const c = clients[0] || {};
    const p = parametres[0] || {};

    const nomEntreprise =
      p.nom_entreprise ||
      p.entreprise ||
      p.nom ||
      "Votre entreprise";

    const adresseEntreprise = p.adresse || "";
    const telephoneEntreprise = p.telephone || "";
    const emailEntreprise = p.email || "";

    const lignesHtml = lignes.map(l => `
      <tr>
        <td>${e(l.description)}</td>
        <td>${e(l.quantite)}</td>
        <td>${euro(l.prix_unitaire_ht)}</td>
        <td>${euro(l.total_ht)}</td>
      </tr>
    `).join("");

    content.innerHTML = `
      <div class="head">
        <div>
          <h1>${e(f.numero || "Facture")}</h1>
          <div class="muted">Vérifiez la facture avant validation.</div>
        </div>

        <span class="${badgeClass(f.statut)}">
          ${e(f.statut || "Brouillon")}
        </span>
      </div>

      <section class="invoice">
        <div class="invoice-top">
          <div class="company">
            <h2>${e(nomEntreprise)}</h2>
            ${adresseEntreprise ? `<p>${e(adresseEntreprise)}</p>` : ""}
            ${telephoneEntreprise ? `<p>${e(telephoneEntreprise)}</p>` : ""}
            ${emailEntreprise ? `<p>${e(emailEntreprise)}</p>` : ""}
          </div>

          <div class="client">
            <strong>Facturé à</strong>
            <p>${e(c.nom || "Client")}</p>
            ${c.adresse ? `<p>${e(c.adresse)}</p>` : ""}
            ${c.email ? `<p>${e(c.email)}</p>` : ""}
            ${c.telephone ? `<p>${e(c.telephone)}</p>` : ""}
          </div>
        </div>

        <div class="meta">
          <div>
            Date de création
            <strong>${date(f.date_creation)}</strong>
          </div>

          <div>
            Facture
            <strong>${e(f.numero || "—")}</strong>
          </div>

          <div>
            Statut
            <strong>${e(f.statut || "Brouillon")}</strong>
          </div>

          ${f.moyen_paiement ? `
            <div>
              Paiement
              <strong>${e(f.moyen_paiement)}</strong>
            </div>
          ` : ""}
        </div>

        <table>
          <thead>
            <tr>
              <th>Prestation</th>
              <th>Qté</th>
              <th>Prix unitaire HT</th>
              <th>Total HT</th>
            </tr>
          </thead>

          <tbody>
            ${lignesHtml || `<tr><td colspan="4">Aucune ligne.</td></tr>`}
          </tbody>
        </table>

        <div class="totals">
          <div class="total-row">
            <span>Total HT</span>
            <strong>${euro(f.total_ht)}</strong>
          </div>

          <div class="total-row">
            <span>TVA (${e(f.taux_tva)} %)</span>
            <strong>${euro(Number(f.total_ttc || 0) - Number(f.total_ht || 0))}</strong>
          </div>

          <div class="total-row ttc">
            <span>Total TTC</span>
            <span>${euro(f.total_ttc)}</span>
          </div>
        </div>

        ${boutonAction(f)}
      </section>
    `;
  } catch (err) {
    console.error(err);

    content.innerHTML = `
      <div class="error">
        ${e(err.message || "Impossible de charger la facture.")}
      </div>
    `;
  }
}

async function validerEtEnvoyerFacture() {
  if (!factureActuelle) return;

  const bouton = document.getElementById("btnValider");

  try {
    if (bouton) {
      bouton.disabled = true;
      bouton.textContent = "Validation et envoi…";
    }

    const uid = encodeURIComponent(currentUser.id);
    const fid = encodeURIComponent(factureActuelle.id);

    await patch(
      `factures?id=eq.${fid}&user_id=eq.${uid}`,
      {
        statut: "Validée"
      }
    );

    factureActuelle.statut = "Validée";

    await envoyerFacture(true);
  } catch (err) {
    console.error(err);

    alert(
      "La facture n'a pas pu être validée ou envoyée. " +
      (err.message || "")
    );

    if (bouton) {
      bouton.disabled = false;
      bouton.textContent = "Valider et envoyer — À payer";
    }
  }
}

async function validerDejaPayee() {
  if (!factureActuelle || factureActuelle.statut !== "Brouillon") return;

  const moyen = document.getElementById("moyenPaiement")?.value || "";
  const reference = document.getElementById("paiementReference")?.value.trim() || null;
  const bouton = document.getElementById("btnConfirmerPaiement");

  if (!moyen) {
    alert("Choisissez le moyen de paiement reçu.");
    return;
  }

  if (!window.confirm(
    `Confirmer que ${factureActuelle.numero} a déjà été payée par ${moyen} ?`
  )) {
    return;
  }

  try {
    if (bouton) {
      bouton.disabled = true;
      bouton.textContent = "Validation et envoi…";
    }

    const uid = encodeURIComponent(currentUser.id);
    const fid = encodeURIComponent(factureActuelle.id);

    // L'Edge Function existante envoie les factures validées et les passe
    // ensuite en "Envoyée". On valide donc d'abord, on envoie, puis seulement
    // après un envoi réussi on enregistre l'encaissement comme "Payée".
    await patch(
      `factures?id=eq.${fid}&user_id=eq.${uid}`,
      {
        statut: "Validée",
        moyen_paiement: moyen,
        paiement_reference: reference,
        paiement_note: "Paiement reçu sur place"
      }
    );

    factureActuelle.statut = "Validée";

    const response = await fetch(
      `${SUPABASE_URL}/functions/v1/envoyer-facture-client`,
      {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          facture_id: factureActuelle.id
        })
      }
    );

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data?.error ||
        data?.message ||
        "Impossible d'envoyer la facture."
      );
    }

    const paiement = await patch(
      `factures?id=eq.${fid}&user_id=eq.${uid}`,
      {
        statut: "Payée",
        moyen_paiement: moyen,
        paiement_reference: reference,
        paiement_note: "Paiement reçu sur place",
        date_paiement: new Date().toISOString()
      }
    );

    factureActuelle = paiement?.[0] || {
      ...factureActuelle,
      statut: "Payée",
      moyen_paiement: moyen,
      paiement_reference: reference,
      paiement_note: "Paiement reçu sur place",
      date_paiement: new Date().toISOString()
    };

    alert(
      `${factureActuelle.numero} a été enregistrée comme payée par ${moyen} et envoyée automatiquement au client.`
    );

    await charger();
  } catch (err) {
    console.error(err);

    alert(
      "Le paiement ou l'envoi n'a pas pu être finalisé. " +
      (err.message || "")
    );

    await charger();
  }
}

async function envoyerFacture(depuisValidation = false) {
  if (!factureActuelle) return;

  const bouton = document.getElementById("btnValider");

  try {
    if (bouton) {
      bouton.disabled = true;
      bouton.textContent = "Envoi en cours…";
    }

    const response = await fetch(
      `${SUPABASE_URL}/functions/v1/envoyer-facture-client`,
      {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          facture_id: factureActuelle.id
        })
      }
    );

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data?.error ||
        data?.message ||
        "Impossible d'envoyer la facture."
      );
    }

    alert(
      `${factureActuelle.numero} a été validée et envoyée automatiquement au client.`
    );

    await charger();
  } catch (err) {
    console.error(err);

    alert(
      (depuisValidation
        ? "La facture a été validée, mais l'envoi automatique a échoué. "
        : "L'envoi automatique a échoué. ") +
      (err.message || "")
    );

    await charger();
  }
}

charger();
</script>
</body>
</html>
