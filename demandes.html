<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Demandes clients — 321Devis</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 30px;
            background: #f3f4f6;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2937;
        }


        .container {
            max-width: 1100px;
            margin: auto;
        }


        .header {
            background: #111827;
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }


        .header h1 {
            margin: 0 0 8px 0;
        }


        .header p {
            margin: 0;
            color: #d1d5db;
        }


        .navigation {
            margin-bottom: 25px;
        }


        .navigation a {
            color: #2563eb;
            text-decoration: none;
            margin-right: 20px;
        }


        .bloc {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }


        .demande {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }


        .demande h3 {
            margin-top: 0;
        }


        .infos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 15px 0;
        }


        .info {
            padding: 12px;
            background: #f9fafb;
            border-radius: 6px;
        }


        .description {
            padding: 15px;
            background: #f9fafb;
            border-radius: 6px;
            margin: 15px 0;
            line-height: 1.5;
            white-space: pre-wrap;
        }


        .statut {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #fef3c7;
            color: #92400e;
            font-size: 13px;
            font-weight: bold;
        }


        .statut-traitee {
            background: #dbeafe;
            color: #1e40af;
        }


        .statut-terminee {
            background: #d1fae5;
            color: #065f46;
        }


        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            margin-right: 8px;
            margin-top: 8px;
        }


        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }


        .btn-ouvrir {
            background: #2563eb;
        }


        .btn-supprimer {
            background: #dc2626;
        }


        .btn-devis {
            background: #059669;
        }


        .btn-voir {
            background: #7c3aed;
        }


        .btn-traiter {
            background: #6b7280;
        }


        .vide {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }


        .formulaire {
            display: none;
        }


        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 6px;
        }


        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }


        textarea {
            min-height: 120px;
            resize: vertical;
        }


        .actions-formulaire {
            margin-top: 20px;
        }


        .alerte {
            padding: 15px;
            margin: 20px 0;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 6px;
            color: #9a3412;
        }


        .succes {
            padding: 15px;
            margin: 20px 0;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 6px;
            color: #065f46;
        }


        @media (max-width: 750px) {

            .infos {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- EN-TÊTE -->

    <div class="header">

        <h1>
            321Devis
        </h1>

        <p>
            Demandes clients
        </p>

    </div>


    <!-- NAVIGATION -->

    <div class="navigation">

        <a href="index.html">
            ← Tableau de bord
        </a>

        <a href="demande-client.html">
            Nouvelle demande
        </a>

        <a href="validation-devis.html">
            Validation
        </a>

        <a href="historique.html">
            Historique
        </a>

    </div>


    <!-- LISTE DES DEMANDES -->

    <div class="bloc">

        <h2>
            Demandes reçues
        </h2>


        <div id="listeDemandes"></div>

    </div>


    <!-- DETAIL DE LA DEMANDE -->

    <div
        class="bloc formulaire"
        id="formulaire"
    >

        <h2>
            Traiter la demande
        </h2>


        <p>
            Numéro de demande :
            <strong id="numeroDemande"></strong>
        </p>


        <p>
            Statut :
            <span
                class="statut"
                id="statutDemande"
            ></span>
        </p>


        <!-- MESSAGE SI DEVIS EXISTANT -->

        <div
            class="alerte"
            id="dejaConvertie"
            style="display:none;"
        >

            Cette demande a déjà été convertie en devis.

            <br><br>

            Numéro du devis :
            <strong id="numeroDevisExistant"></strong>

        </div>


        <!-- CLIENT -->

        <h3>
            Client
        </h3>


        <label for="nomClient">
            Nom
        </label>

        <input
            type="text"
            id="nomClient"
        >


        <label for="telephoneClient">
            Téléphone
        </label>

        <input
            type="text"
            id="telephoneClient"
        >


        <label for="emailClient">
            E-mail
        </label>

        <input
            type="email"
            id="emailClient"
        >


        <label for="adresseClient">
            Adresse
        </label>

        <input
            type="text"
            id="adresseClient"
        >


        <!-- DEMANDE -->

        <h3>
            Demande
        </h3>


        <label for="typeTravaux">
            Type de travaux
        </label>

        <input
            type="text"
            id="typeTravaux"
            readonly
        >


        <label for="descriptionDemande">
            Description
        </label>

        <textarea
            id="descriptionDemande"
            readonly
        ></textarea>


        <label for="quantiteDemande">
            Quantité estimée
        </label>

        <input
            type="number"
            id="quantiteDemande"
            min="1"
            step="1"
        >


        <!-- ACTIONS -->

        <div class="actions-formulaire">


            <button
                id="boutonPreparer"
                class="btn-devis"
                onclick="preparerDevis()"
            >
                Préparer le devis
            </button>


            <button
                id="boutonVoirDevis"
                class="btn-voir"
                onclick="ouvrirDevisExistant()"
                style="display:none;"
            >
                Voir le devis existant
            </button>


            <button
                id="boutonTraitee"
                class="btn-traiter"
                onclick="marquerTraitee()"
            >
                Marquer comme traitée
            </button>


            <button
                class="btn-supprimer"
                onclick="supprimerDemandeActuelle()"
            >
                Supprimer
            </button>

        </div>


        <div
            class="succes"
            id="message"
            style="display:none;"
        >
            Demande mise à jour.
        </div>

    </div>


</div>


<script>


    /*
     * Chargement des demandes
     */

    let demandes = [];


    try {

        demandes =
            JSON.parse(
                localStorage.getItem(
                    "demandes321Devis"
                )
            ) || [];

    } catch (erreur) {

        console.error(
            "Erreur lecture demandes :",
            erreur
        );

        demandes = [];

    }


    /*
     * Chargement des devis
     */

    let devis = [];


    try {

        devis =
            JSON.parse(
                localStorage.getItem(
                    "devis321Devis"
                )
            ) || [];

    } catch (erreur) {

        console.error(
            "Erreur lecture devis :",
            erreur
        );

        devis = [];

    }


    let demandeActuelle = null;


    /*
     * Afficher les demandes
     */

    function afficherDemandes() {

        const zone =
            document.getElementById(
                "listeDemandes"
            );


        zone.innerHTML = "";


        if (!Array.isArray(demandes) || demandes.length === 0) {

            zone.innerHTML = `

                <div class="vide">

                    Aucune demande client reçue.

                </div>

            `;

            return;

        }


        const demandesTriees =
            [...demandes].reverse();


        demandesTriees.forEach(
            function(demande) {

                const carte =
                    document.createElement(
                        "div"
                    );


                carte.className =
                    "demande";


                let classeStatut =
                    "statut";


                if (
                    demande.statut ===
                    "Traitée"
                ) {

                    classeStatut +=
                        " statut-traitee";

                }


                if (
                    demande.statut ===
                    "Convertie en devis"
                ) {

                    classeStatut +=
                        " statut-terminee";

                }


                const bouton =
                    document.createElement(
                        "button"
                    );


                bouton.className =
                    "btn-ouvrir";


                bouton.textContent =
                    "Ouvrir";


                bouton.onclick =
                    function() {

                        ouvrirDemande(
                            demande.numero
                        );

                    };


                carte.innerHTML = `

                    <h3>
                        Demande ${demande.numero}
                    </h3>

                    <span class="${classeStatut}">
                        ${demande.statut}
                    </span>

                    <div class="infos">

                        <div class="info">

                            <strong>
                                Client
                            </strong>

                            <br>

                            ${demande.client.nom}

                        </div>


                        <div class="info">

                            <strong>
                                Type
                            </strong>

                            <br>

                            ${demande.typeTravaux}

                        </div>


                        <div class="info">

                            <strong>
                                Date
                            </strong>

                            <br>

                            ${formaterDate(
                                demande.date
                            )}

                        </div>

                    </div>


                    <div class="description">

                        <strong>
                            Demande :
                        </strong>

                        <br><br>

                        ${demande.description}

                    </div>

                `;


                carte.appendChild(
                    bouton
                );


                zone.appendChild(
                    carte
                );

            }
        );

    }


    /*
     * Formater une date
     */

    function formaterDate(dateISO) {

        const date =
            new Date(dateISO);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "Date inconnue";

        }


        return date.toLocaleDateString(
            "fr-FR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    /*
     * Trouver un devis lié à une demande
     */

    function trouverDevisPourDemande(
        numeroDemande
    ) {

        return (
            devis.find(
                function(devisItem) {

                    return (
                        devisItem.demandeOrigine ===
                        numeroDemande
                    );

                }
            ) || null
        );

    }


    /*
     * Ouvrir une demande
     */

    function ouvrirDemande(numero) {

        const demande =
            demandes.find(
                function(element) {

                    return (
                        element.numero ===
                        numero
                    );

                }
            );


        if (!demande) {

            alert(
                "Demande introuvable."
            );

            return;

        }


        demandeActuelle =
            demande;


        /*
         * Affichage du formulaire
         */

        document.getElementById(
            "formulaire"
        ).style.display =
            "block";


        /*
         * Remplissage des informations
         */

        document.getElementById(
            "numeroDemande"
        ).textContent =
            demande.numero || "";


        document.getElementById(
            "statutDemande"
        ).textContent =
            demande.statut || "Nouvelle";


        document.getElementById(
            "nomClient"
        ).value =
            demande.client &&
            demande.client.nom
                ? demande.client.nom
                : "";


        document.getElementById(
            "telephoneClient"
        ).value =
            demande.client &&
            demande.client.telephone
                ? demande.client.telephone
                : "";


        document.getElementById(
            "emailClient"
        ).value =
            demande.client &&
            demande.client.email
                ? demande.client.email
                : "";


        document.getElementById(
            "adresseClient"
        ).value =
            demande.client &&
            demande.client.adresse
                ? demande.client.adresse
                : "";


        document.getElementById(
            "typeTravaux"
        ).value =
            demande.typeTravaux || "";


        document.getElementById(
            "descriptionDemande"
        ).value =
            demande.description || "";


        document.getElementById(
            "quantiteDemande"
        ).value =
            demande.quantite || 1;


        /*
         * Vérification d'un devis existant
         */

        const devisExistant =
            trouverDevisPourDemande(
                demande.numero
            );


        const messageDejaConvertie =
            document.getElementById(
                "dejaConvertie"
            );


        const numeroDevisExistant =
            document.getElementById(
                "numeroDevisExistant"
            );


        const boutonPreparer =
            document.getElementById(
                "boutonPreparer"
            );


        const boutonVoirDevis =
            document.getElementById(
                "boutonVoirDevis"
            );


        const boutonTraitee =
            document.getElementById(
                "boutonTraitee"
            );


        if (devisExistant) {

            /*
             * La demande est déjà liée
             * à un devis.
             */

            demandeActuelle.statut =
                "Convertie en devis";


            demandeActuelle.devisNumero =
                devisExistant.numero;


            messageDejaConvertie.style.display =
                "block";


            numeroDevisExistant.textContent =
                devisExistant.numero;


            boutonPreparer.disabled =
                true;


            boutonVoirDevis.style.display =
                "inline-block";


            boutonTraitee.disabled =
                true;


            document.getElementById(
                "statutDemande"
            ).textContent =
                "Convertie en devis";


        } else {

            /*
             * Aucun devis lié.
             */

            messageDejaConvertie.style.display =
                "none";


            numeroDevisExistant.textContent =
                "";


            boutonPreparer.disabled =
                false;


            boutonVoirDevis.style.display =
                "none";


            boutonTraitee.disabled =
                false;

        }


        /*
         * Sauvegarde de l'état éventuel
         */

        const index =
            demandes.findIndex(
                function(element) {

                    return (
                        element.numero ===
                        numero
                    );

                }
            );


        if (index !== -1) {

            demandes[index] =
                demandeActuelle;


            localStorage.setItem(
                "demandes321Devis",
                JSON.stringify(
                    demandes
                )
            );

        }


        /*
         * Défilement vers le formulaire
         */

        window.scrollTo({

            top:
                document.getElementById(
                    "formulaire"
                ).offsetTop - 20,

            behavior:
                "smooth"

        });

    }


    /*
     * Sauvegarder les modifications
     */

    function sauvegarderDemande() {

        if (!demandeActuelle) {

            return false;

        }


        const nom =
            document
                .getElementById(
                    "nomClient"
                )
                .value
                .trim();


        const telephone =
            document
                .getElementById(
                    "telephoneClient"
                )
                .value
                .trim();


        const email =
            document
                .getElementById(
                    "emailClient"
                )
                .value
                .trim();


        const adresse =
            document
                .getElementById(
                    "adresseClient"
                )
                .value
                .trim();


        const quantite =
            Number(
                document
                    .getElementById(
                        "quantiteDemande"
                    )
                    .value
            );


        if (
            !Number.isFinite(
                quantite
            ) ||
            quantite <= 0
        ) {

            alert(
                "La quantité doit être supérieure à 0."
            );

            return false;

        }


        demandeActuelle.client =
            demandeActuelle.client || {};


        demandeActuelle.client.nom =
            nom;


        demandeActuelle.client.telephone =
            telephone;


        demandeActuelle.client.email =
            email;


        demandeActuelle.client.adresse =
            adresse;


        demandeActuelle.quantite =
            quantite;


        const index =
            demandes.findIndex(
                function(element) {

                    return (
                        element.numero ===
                        demandeActuelle.numero
                    );

                }
            );


        if (index === -1) {

            alert(
                "Demande introuvable."
            );

            return false;

        }


        demandes[index] =
            demandeActuelle;


        localStorage.setItem(
            "demandes321Devis",
            JSON.stringify(
                demandes
            )
        );


        return true;

    }


    /*
     * Préparer le devis
     */

    function preparerDevis() {

        if (!demandeActuelle) {

            alert(
                "Sélectionne d'abord une demande."
            );

            return;

        }


        /*
         * Protection anti-doublon
         */

        devis =
            JSON.parse(
                localStorage.getItem(
                    "devis321Devis"
                )
            ) || [];


        const devisExistant =
            trouverDevisPourDemande(
                demandeActuelle.numero
            );


        if (devisExistant) {

            alert(
                "Cette demande possède déjà le devis " +
                devisExistant.numero +
                "."
            );


            ouvrirDevisExistant();

            return;

        }


        /*
         * Sauvegarder les coordonnées
         */

        if (!sauvegarderDemande()) {

            return;

        }


        /*
         * Catalogue
         */

        const catalogue =
            JSON.parse(
                localStorage.getItem(
                    "catalogue321Devis"
                )
            ) || [];


        /*
         * Type
         */

        const type =
            demandeActuelle.typeTravaux;


        /*
         * Quantité
         */

        const quantite =
            Number(
                demandeActuelle.quantite
            );


        const prestations = [];


        /*
         * Fonction de recherche
         */

        function chercherCatalogue(texte) {

            return catalogue.find(
                function(item) {

                    return (
                        String(
                            item.designation
                        )
                        .toLowerCase()
                        .includes(
                            texte.toLowerCase()
                        )
                    );

                }
            ) || null;

        }


        /*
         * Déplacement
         */

        const deplacement =
            chercherCatalogue(
                "déplacement"
            );


        if (deplacement) {

            prestations.push({

                prestation:
                    deplacement,

                quantite:
                    1

            });

        }


        /*
         * Recherche de fuite
         */

        if (
            type ===
            "Fuite / recherche de fuite"
        ) {

            const prestation =
                chercherCatalogue(
                    "recherche de fuite"
                );


            if (prestation) {

                prestations.push({

                    prestation:
                        prestation,

                    quantite:
                        quantite

                });

            }

        }


        /*
         * Remplacement siphon
         */

        if (
            type ===
            "Remplacement de siphon"
        ) {

            const prestation =
                chercherCatalogue(
                    "remplacement siphon"
                );


            if (prestation) {

                prestations.push({

                    prestation:
                        prestation,

                    quantite:
                        quantite

                });

            }

        }


        /*
         * Débouchage
         */

        if (
            type ===
            "Canalisation bouchée"
        ) {

            const prestation =
                chercherCatalogue(
                    "débouchage canalisation"
                );


            if (prestation) {

                prestations.push({

                    prestation:
                        prestation,

                    quantite:
                        quantite

                });

            }

        }


        /*
         * Main-d'œuvre
         */

        if (
            type ===
            "Main-d'œuvre / intervention"
        ) {

            const prestation =
                chercherCatalogue(
                    "main-d'œuvre"
                );


            if (prestation) {

                prestations.push({

                    prestation:
                        prestation,

                    quantite:
                        quantite

                });

            }

        }


        /*
         * Aucune prestation trouvée
         */

        if (
            prestations.length === 0
        ) {

            alert(
                "Aucune prestation correspondante n'a été trouvée dans le catalogue."
            );

            return;

        }


        /*
         * Paramètres entreprise
         */

        const parametres =
            JSON.parse(
                localStorage.getItem(
                    "parametres321Devis"
                )
            ) || {};


        const tauxTVA =
            Number.isFinite(
                Number(
                    parametres.tauxTVA
                )
            )
                ? Number(
                    parametres.tauxTVA
                )
                : 20;


        /*
         * Génération du numéro
         */

        let compteur =
            Number(
                localStorage.getItem(
                    "compteurDevis321Devis"
                )
            ) || 0;


        compteur++;


        localStorage.setItem(
            "compteurDevis321Devis",
            compteur
        );


        const numeroDevis =
            "DEV-" +
            new Date().getFullYear() +
            "-" +
            String(
                compteur
            ).padStart(
                4,
                "0"
            );


        /*
         * Construction des lignes
         */

        const lignes = [];

        let totalHT = 0;


        prestations.forEach(
            function(element) {

                const prestation =
                    element.prestation;


                const qte =
                    Number(
                        element.quantite
                    );


                const prix =
                    Number(
                        prestation.prix
                    );


                const totalLigne =
                    prix *
                    qte;


                totalHT +=
                    totalLigne;


                lignes.push({

                    description:
                        prestation.designation,

                    quantite:
                        qte,

                    prixUnitaireHT:
                        prix,

                    totalHT:
                        totalLigne

                });

            }
        );


        /*
         * TVA
         */

        const tva =
            totalHT *
            tauxTVA /
            100;


        const totalTTC =
            totalHT +
            tva;


        /*
         * Création du devis
         */

        const nouveauDevis = {

            numero:
                numeroDevis,

            date:
                new Date().toISOString(),

            statut:
                "Brouillon - validation requise",

            origine:
                "Demande client",

            demandeOrigine:
                demandeActuelle.numero,

            client: {

                nom:
                    demandeActuelle.client.nom,

                telephone:
                    demandeActuelle.client.telephone,

                email:
                    demandeActuelle.client.email,

                adresse:
                    demandeActuelle.client.adresse

            },

            demandeClient: {

                typeTravaux:
                    demandeActuelle.typeTravaux,

                description:
                    demandeActuelle.description

            },

            lignes:
                lignes,

            totalHT:
                totalHT,

            tauxTVA:
                tauxTVA,

            tva:
                tva,

            totalTTC:
                totalTTC

        };


        /*
         * Enregistrement
         */

        devis.push(
            nouveauDevis
        );


        localStorage.setItem(
            "devis321Devis",
            JSON.stringify(
                devis
            )
        );


        /*
         * Liaison demande / devis
         */

        demandeActuelle.statut =
            "Convertie en devis";


        demandeActuelle.devisNumero =
            numeroDevis;


        const indexDemande =
            demandes.findIndex(
                function(element) {

                    return (
                        element.numero ===
                        demandeActuelle.numero
                    );

                }
            );


        if (
            indexDemande !== -1
        ) {

            demandes[indexDemande] =
                demandeActuelle;


            localStorage.setItem(
                "demandes321Devis",
                JSON.stringify(
                    demandes
                )
            );

        }


        alert(
            "Brouillon de devis préparé avec succès !\n\n" +
            "Numéro : " +
            numeroDevis
        );


        /*
         * Aller vers la validation
         */

        window.location.href =
            "validation-devis.html";

    }


    /*
     * Ouvrir le devis existant
     */

    function ouvrirDevisExistant() {

        if (!demandeActuelle) {

            alert(
                "Aucune demande sélectionnée."
            );

            return;

        }


        devis =
            JSON.parse(
                localStorage.getItem(
                    "devis321Devis"
                )
            ) || [];


        const devisExistant =
            trouverDevisPourDemande(
                demandeActuelle.numero
            );


        if (!devisExistant) {

            alert(
                "Aucun devis trouvé pour cette demande."
            );

            return;

        }


        window.location.href =
            "voir-devis.html?numero=" +
            encodeURIComponent(
                devisExistant.numero
            );

    }


    /*
     * Marquer comme traitée
     */

    function marquerTraitee() {

        if (!demandeActuelle) {

            alert(
                "Sélectionne d'abord une demande."
            );

            return;

        }


        const devisExistant =
            trouverDevisPourDemande(
                demandeActuelle.numero
            );


        if (devisExistant) {

            alert(
                "Cette demande est déjà liée au devis " +
                devisExistant.numero +
                "."
            );

            return;

        }


        if (!sauvegarderDemande()) {

            return;

        }


        demandeActuelle.statut =
            "Traitée";


        const index =
            demandes.findIndex(
                function(element) {

                    return (
                        element.numero ===
                        demandeActuelle.numero
                    );

                }
            );


        if (index !== -1) {

            demandes[index] =
                demandeActuelle;

        }


        localStorage.setItem(
            "demandes321Devis",
            JSON.stringify(
                demandes
            )
        );


        document.getElementById(
            "statutDemande"
        ).textContent =
            "Traitée";


        afficherDemandes();


        alert(
            "Demande marquée comme traitée."
        );

    }


    /*
     * Supprimer une demande
     */

    function supprimerDemandeActuelle() {

        if (!demandeActuelle) {

            alert(
                "Sélectionne d'abord une demande."
            );

            return;

        }


        const devisExistant =
            trouverDevisPourDemande(
                demandeActuelle.numero
            );


        if (devisExistant) {

            alert(
                "Cette demande est liée au devis " +
                devisExistant.numero +
                ". Elle ne peut pas être supprimée ici."
            );

            return;

        }


        const confirmation =
            confirm(
                "Supprimer définitivement cette demande ?"
            );


        if (!confirmation) {

            return;

        }


        const index =
            demandes.findIndex(
                function(element) {

                    return (
                        element.numero ===
                        demandeActuelle.numero
                    );

                }
            );


        if (index === -1) {

            alert(
                "Demande introuvable."
            );

            return;

        }


        demandes.splice(
            index,
            1
        );


        localStorage.setItem(
            "demandes321Devis",
            JSON.stringify(
                demandes
            )
        );


        demandeActuelle =
            null;


        document.getElementById(
            "formulaire"
        ).style.display =
            "none";


        afficherDemandes();

    }


    /*
     * Affichage initial
     */

    afficherDemandes();

</script>


</body>
