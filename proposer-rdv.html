<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposer un rendez-vous — 321Devis</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --blue:#2563eb;
      --green:#16a34a;
      --red:#dc2626;
      --shadow:0 10px 30px rgba(17,24,39,.06);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    a{text-decoration:none;color:inherit}

    .app{
      min-height:100vh;
      display:grid;
      grid-template-columns:220px 1fr;
    }

    aside{
      background:#fff;
      border-right:1px solid var(--border);
      padding:24px 16px;
    }

    .brand{
      font-size:25px;
      font-weight:850;
      margin-bottom:30px;
    }

    .brand span{color:var(--blue)}

    nav{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    nav a{
      padding:12px 14px;
      border-radius:11px;
      font-weight:650;
      color:#374151;
    }

    nav a:hover{background:#f3f4f6}
    nav a.active{background:#111827;color:#fff}

    main{
      width:100%;
      max-width:900px;
      margin:0 auto;
      padding:32px;
    }

    .back{
      display:inline-block;
      margin-bottom:18px;
      color:#4b5563;
      font-weight:650;
    }

    h1{
      margin:0 0 8px;
      font-size:30px;
    }

    .subtitle{
      color:var(--muted);
      margin-bottom:24px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:26px;
    }

    .devis-box{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-bottom:24px;
      padding:16px;
      border-radius:14px;
      background:#f9fafb;
    }

    .devis-box div{
      color:var(--muted);
      font-size:13px;
    }

    .devis-box strong{
      display:block;
      margin-top:5px;
      color:var(--text);
      font-size:15px;
    }

    label{
      display:block;
      font-weight:750;
      margin-bottom:8px;
    }

    .hint{
      color:var(--muted);
      font-size:13px;
      margin-bottom:10px;
    }

    textarea,
    input{
      width:100%;
      border:1px solid var(--border);
      border-radius:11px;
      padding:12px 13px;
      font:inherit;
      background:#fff;
      color:var(--text);
    }

    textarea{
      min-height:92px;
      resize:vertical;
    }

    textarea:focus,
    input:focus{
      outline:2px solid rgba(37,99,235,.12);
      border-color:#93c5fd;
    }

    .section{
      margin-top:24px;
    }

    .creneaux{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .creneau{
      display:grid;
      grid-template-columns:1fr 1fr auto;
      gap:10px;
      align-items:end;
      padding:14px;
      border:1px solid var(--border);
      border-radius:13px;
      background:#fafafa;
    }

    .field-label{
      font-size:12px;
      font-weight:700;
      color:var(--muted);
      margin-bottom:6px;
    }

    .btn{
      border:0;
      border-radius:11px;
      padding:12px 16px;
      font:inherit;
      font-weight:800;
      cursor:pointer;
    }

    .btn-add{
      background:#f3f4f6;
      color:#111827;
      margin-top:12px;
    }

    .btn-delete{
      background:#fff;
      color:var(--red);
      border:1px solid #fecaca;
      min-width:46px;
    }

    .btn-primary{
      background:#111827;
      color:#fff;
      width:100%;
      margin-top:26px;
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .error,
    .loading{
      padding:45px 20px;
      text-align:center;
      color:var(--muted);
    }

    .error{color:var(--red)}

    @media(max-width:760px){
      .app{display:block}
      aside{display:none}
      main{padding:20px 14px}
      .card{padding:20px}
      .devis-box{grid-template-columns:1fr}
      .creneau{grid-template-columns:1fr}
      .btn-delete{width:100%}
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span>321</span>Devis</div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="demandes.html">Demandes</a>
      <a href="historique.html" class="active">Devis</a>
      <a href="factures.html">Factures</a>
      <a href="catalogue.html">Catalogue</a>
      <a href="parametres.html">Paramètres</a>
    </nav>
  </aside>

  <main>
    <a class="back" href="historique.html">← Retour aux devis</a>

    <h1>Proposer un rendez-vous</h1>
    <div class="subtitle">
      Indiquez vos disponibilités. 321Devis les transmettra ensuite au client.
    </div>

    <div id="content">
      <div class="loading">Chargement du devis…</div>
    </div>
  </main>
</div>

<script>
const SUPABASE_URL = "https://ywmuiqavjdzuaittqesc.supabase.co";
const SUPABASE_KEY = "sb_publishable_TiG6CaYzFOPjZ8JJSHRI_w_mZd8Kmpv";

let accessToken = null;
let currentUser = null;
let devisActuel = null;
let clientActuel = null;

function getStoredSession() {
  for (const key of Object.keys(localStorage).filter(
    key => key.startsWith("sb-") && key.endsWith("-auth-token")
  )) {
    try {
      const value = JSON.parse(localStorage.getItem(key));

      if (value?.access_token) return value;
      if (value?.currentSession?.access_token) return value.currentSession;
    } catch (e) {}
  }

  return null;
}

async function getCurrentUser() {
  const session = getStoredSession();

  if (!session?.access_token) {
    location.href = "connexion.html";
    return false;
  }

  accessToken = session.access_token;

  const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${accessToken}`
    }
  });

  if (!response.ok) {
    location.href = "connexion.html";
    return false;
  }

  currentUser = await response.json();
  return true;
}

async function apiGet(path) {
  const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${accessToken}`
    }
  });

  if (!response.ok) {
    throw new Error(await response.text());
  }

  return response.json();
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatMoney(value) {
  return new Intl.NumberFormat("fr-FR", {
    style: "currency",
    currency: "EUR"
  }).format(Number(value || 0));
}

function ligneCreneau() {
  return `
    <div class="creneau">
      <div>
        <div class="field-label">Début</div>
        <input type="datetime-local" class="creneau-debut">
      </div>

      <div>
        <div class="field-label">Fin (facultatif)</div>
        <input type="datetime-local" class="creneau-fin">
      </div>

      <button type="button" class="btn btn-delete" onclick="supprimerCreneau(this)">
        Supprimer
      </button>
    </div>
  `;
}

function ajouterCreneau() {
  document.getElementById("creneaux").insertAdjacentHTML("beforeend", ligneCreneau());
}

function supprimerCreneau(button) {
  const container = document.getElementById("creneaux");

  if (container.querySelectorAll(".creneau").length <= 1) {
    alert("Gardez au moins un créneau.");
    return;
  }

  button.closest(".creneau").remove();
}

function toIsoLocal(value) {
  if (!value) return null;

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return null;
  }

  return date.toISOString();
}

async function charger() {
  const content = document.getElementById("content");

  try {
    if (!await getCurrentUser()) return;

    const params = new URLSearchParams(location.search);
    const devisId = params.get("id");
    const devisNumero = params.get("numero");

    if (!devisId && !devisNumero) {
      throw new Error("Identifiant ou numéro du devis manquant.");
    }

    const uid = encodeURIComponent(currentUser.id);

    const filtreDevis = devisId
      ? `id=eq.${encodeURIComponent(devisId)}`
      : `numero=eq.${encodeURIComponent(devisNumero)}`;

    const devis = await apiGet(
      `devis?select=id,numero,client_id,statut,total_ttc&${filtreDevis}&user_id=eq.${uid}&limit=1`
    );

    if (!devis.length) {
      throw new Error("Devis introuvable.");
    }

    devisActuel = devis[0];

    const did = encodeURIComponent(devisActuel.id);

    if (devisActuel.statut !== "Accepté") {
      throw new Error("Le rendez-vous peut être proposé uniquement pour un devis accepté.");
    }

    const clients = await apiGet(
      `clients?select=id,nom,email,telephone&id=eq.${encodeURIComponent(devisActuel.client_id)}&user_id=eq.${uid}&limit=1`
    );

    clientActuel = clients[0] || {};

    const propositions = await apiGet(
      `propositions_rdv?select=id,statut&devis_id=eq.${did}&user_id=eq.${uid}&limit=1`
    );

    if (propositions.length) {
      throw new Error("Des disponibilités ont déjà été proposées pour ce devis.");
    }

    content.innerHTML = `
      <section class="card">
        <div class="devis-box">
          <div>
            Devis
            <strong>${escapeHtml(devisActuel.numero || "—")}</strong>
          </div>

          <div>
            Client
            <strong>${escapeHtml(clientActuel.nom || "Client")}</strong>
          </div>

          <div>
            Montant
            <strong>${formatMoney(devisActuel.total_ttc)}</strong>
          </div>

          <div>
            Statut
            <strong>${escapeHtml(devisActuel.statut)}</strong>
          </div>
        </div>

        <label for="messageArtisan">Message pour le client</label>
        <div class="hint">
          Facultatif. Exemple : « Voici mes prochaines disponibilités pour l'intervention. »
        </div>

        <textarea
          id="messageArtisan"
          placeholder="Voici mes prochaines disponibilités pour l'intervention."
        ></textarea>

        <div class="section">
          <label>Vos disponibilités</label>
          <div class="hint">
            Ajoutez les créneaux que le client pourra choisir.
          </div>

          <div class="creneaux" id="creneaux">
            ${ligneCreneau()}
          </div>

          <button type="button" class="btn btn-add" onclick="ajouterCreneau()">
            + Ajouter un créneau
          </button>
        </div>

        <button
          type="button"
          class="btn btn-primary"
          id="btnValider"
          onclick="enregistrerDisponibilites()"
        >
          Valider et envoyer au client
        </button>
      </section>
    `;
  } catch (error) {
    console.error(error);

    content.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message || "Impossible de charger le devis.")}
      </div>
    `;
  }
}

async function enregistrerDisponibilites() {
  if (!devisActuel) return;

  const button = document.getElementById("btnValider");

  try {
    const rows = [...document.querySelectorAll(".creneau")];

    const creneaux = rows.map(row => {
      const debutValue = row.querySelector(".creneau-debut").value;
      const finValue = row.querySelector(".creneau-fin").value;

      const debut = toIsoLocal(debutValue);
      const fin = toIsoLocal(finValue);

      if (!debut) {
        throw new Error("Chaque créneau doit avoir une date et une heure de début.");
      }

      if (fin && new Date(fin) <= new Date(debut)) {
        throw new Error("L'heure de fin doit être après l'heure de début.");
      }

      return {
        debut,
        fin
      };
    });

    button.disabled = true;
    button.textContent = "Enregistrement…";

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/creer_proposition_rdv`,
      {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_devis_id: devisActuel.id,
          p_message_artisan: document.getElementById("messageArtisan").value.trim(),
          p_creneaux: creneaux
        })
      }
    );

    const data = await response.json().catch(() => null);

    if (!response.ok) {
      throw new Error(
        data?.message ||
        data?.error ||
        data?.details ||
        "Impossible d'enregistrer les disponibilités."
      );
    }

    const proposition = Array.isArray(data) ? data[0] : data;

    if (!proposition?.proposition_id) {
      throw new Error(
        "Les disponibilités ont été enregistrées, mais 321Devis n'a pas récupéré l'identifiant de la proposition."
      );
    }

    button.textContent = "Envoi au client…";

    const emailResponse = await fetch(
      `${SUPABASE_URL}/functions/v1/envoyer-rdv-client`,
      {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          proposition_id: proposition.proposition_id
        })
      }
    );

    const emailData = await emailResponse.json().catch(() => null);

    if (!emailResponse.ok) {
      throw new Error(
        emailData?.error ||
        emailData?.message ||
        "Les disponibilités ont été enregistrées, mais l'e-mail n'a pas pu être envoyé au client."
      );
    }

    alert(
      "Vos disponibilités ont été enregistrées et envoyées automatiquement au client."
    );

    location.href = "historique.html";
  } catch (error) {
    console.error(error);
    alert(error.message || "Une erreur est survenue.");

    if (button) {
      button.disabled = false;
      button.textContent = "Valider et envoyer au client";
    }
  }
}

charger();
</script>
</body>
</html>
