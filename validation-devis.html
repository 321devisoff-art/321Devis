<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Validation des devis — 321Devis</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 30px;
            background: #f3f4f6;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2937;
        }


        .container {
            max-width: 1100px;
            margin: auto;
        }


        h1 {
            margin-bottom: 5px;
        }


        .navigation {
            margin-bottom: 30px;
        }


        .navigation a {
            color: #2563eb;
            text-decoration: none;
            margin-right: 20px;
        }


        .bloc {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }


        .liste-vide {
            padding: 25px;
            text-align: center;
            color: #6b7280;
        }


        .carte-devis {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 15px;
        }


        .carte-devis h3 {
            margin-top: 0;
        }


        .infos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }


        .info {
            background: #f9fafb;
            padding: 12px;
            border-radius: 6px;
        }


        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            margin-right: 8px;
            margin-bottom: 8px;
        }


        .btn-ouvrir {
            background: #2563eb;
        }


        .btn-valider {
            background: #059669;
        }


        .btn-supprimer {
            background: #dc2626;
        }


        .btn-retour {
            background: #6b7280;
        }


        .editeur {
            display: none;
        }


        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }


        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }


        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
        }


        th {
            background: #111827;
            color: white;
            text-align: left;
        }


        .droite {
            text-align: right;
        }


        .totaux {
            width: 350px;
            max-width: 100%;
            margin-left: auto;
            margin-top: 25px;
        }


        .ligne-total {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }


        .total-final {
            font-size: 20px;
            font-weight: bold;
            border-top: 2px solid #111827;
            padding-top: 12px;
        }


        .statut {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #fef3c7;
            color: #92400e;
            font-size: 13px;
            font-weight: bold;
        }


        .statut-valide {
            background: #d1fae5;
            color: #065f46;
        }


        .erreur {
            color: #b91c1c;
            font-weight: bold;
        }


        @media (max-width: 700px) {

            body {
                padding: 15px;
            }


            .infos {
                grid-template-columns: 1fr;
            }


            table {
                font-size: 13px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        321Devis
    </h1>


    <p>
        Validation des devis
    </p>


    <div class="navigation">

        <a href="index.html">
            ← Tableau de bord
        </a>

        <a href="historique.html">
            Historique
        </a>

        <a href="demande-client.html">
            Nouvelle demande client
        </a>

    </div>


    <!-- LISTE DES BROUILLONS -->

    <div class="bloc">

        <h2>
            Devis à vérifier
        </h2>


        <div id="listeBrouillons"></div>

    </div>


    <!-- ÉDITEUR -->

    <div
        class="bloc editeur"
        id="editeur"
    >

        <h2>
            Vérification du devis
        </h2>


        <p>
            Numéro :
            <strong id="numeroDevis"></strong>
        </p>


        <p>
            Client :
            <strong id="nomClient"></strong>
        </p>


        <p>
            Statut :
            <span
                class="statut"
                id="statutDevis"
            ></span>
        </p>


        <h3>
            Informations client
        </h3>


        <label for="telephone">
            Téléphone
        </label>

        <input
            type="text"
            id="telephone"
        >


        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
        >


        <label for="adresse">
            Adresse
        </label>

        <input
            type="text"
            id="adresse"
        >


        <h3>
            Prestations
        </h3>


        <table>

            <thead>

                <tr>

                    <th>
                        Prestation
                    </th>

                    <th class="droite">
                        Quantité
                    </th>

                    <th class="droite">
                        Prix unitaire HT
                    </th>

                    <th class="droite">
                        Total HT
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="lignesDevis"></tbody>

        </table>


        <div class="totaux">

            <div class="ligne-total">

                <span>
                    Total HT
                </span>

                <strong>
                    <span id="totalHT"></span>
                </strong>

            </div>


            <div class="ligne-total">

                <span>
                    TVA (<span id="tauxTVA"></span> %)
                </span>

                <strong>
                    <span id="tva"></span>
                </strong>

            </div>


            <div class="ligne-total total-final">

                <span>
                    Total TTC
                </span>

                <strong>
                    <span id="totalTTC"></span>
                </strong>

            </div>

        </div>


        <br>


        <button
            class="btn-valider"
            onclick="validerDevis()"
        >
            ✓ Valider le devis
        </button>


        <button
            class="btn-ouvrir"
            onclick="voirDevis()"
        >
            Voir le devis professionnel
        </button>


        <button
            class="btn-retour"
            onclick="fermerEditeur()"
        >
            Retour à la liste
        </button>

    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://ywmuiqavjdzuaittqesc.supabase.co";
const SUPABASE_KEY = "sb_publishable_TiG6CaYzFOPjZ8JJSHRI_w_mZd8Kmpv";

const clientSupabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let utilisateurId = null;
let accessToken = null;

async function verifierUtilisateur() {
    const { data, error } = await clientSupabase.auth.getSession();

    if (error) {
        throw error;
    }

    if (!data || !data.session || !data.session.user) {
        window.location.href = "connexion.html";
        return false;
    }

    utilisateurId = data.session.user.id;
    accessToken = data.session.access_token;

    return true;
}

let devis = [];
let devisActuel = null;
let clientActuel = null;
let lignesActuelles = [];

async function appelerSupabase(endpoint, options = {}) {
    const reponse = await fetch(SUPABASE_URL + "/rest/v1/" + endpoint, {
        method: options.method || "GET",
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + accessToken,
            "Content-Type": "application/json",
            "Accept": "application/json",
            ...(options.headers || {})
        },
        body: options.body
    });

    const texte = await reponse.text();
    let donnees = null;

    if (texte) {
        try { donnees = JSON.parse(texte); }
        catch (erreur) { donnees = texte; }
    }

    if (!reponse.ok) {
        let message = "Erreur Supabase HTTP " + reponse.status;
        if (donnees && typeof donnees === "object" && donnees.message) {
            message += " : " + donnees.message;
        }
        throw new Error(message);
    }

    return donnees;
}

function nombre(v) {
    const n = Number(v);
    return Number.isFinite(n) ? n : 0;
}

function montant(v) {
    return nombre(v).toLocaleString("fr-FR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    }) + " €";
}

function echapperHTML(v) {
    return String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

async function chargerBrouillons() {
    devis = await appelerSupabase(
        "devis?select=id,numero,client_id,demande_id,statut,total_ht,taux_tva,total_ttc,date_validation,created_at&user_id=eq." + encodeURIComponent(utilisateurId) + "&order=created_at.desc"
    );

    if (!Array.isArray(devis)) devis = [];

    const liste = document.getElementById("listeBrouillons");
    liste.innerHTML = "";

    const brouillons = devis.filter(d =>
        d.statut === "Brouillon - validation requise"
    );

    if (brouillons.length === 0) {
        liste.innerHTML = "<p>Aucun devis en attente de validation.</p>";
        document.getElementById("editeur").style.display = "none";
        return;
    }

    brouillons.forEach(d => {
        const bouton = document.createElement("button");
        bouton.type = "button";
        bouton.textContent = d.numero || "Devis";
        bouton.onclick = () => ouvrirDevis(d.id);
        liste.appendChild(bouton);
    });

    const params = new URLSearchParams(window.location.search);
    const numeroURL = params.get("numero");
    const cible = numeroURL
        ? brouillons.find(d => d.numero === numeroURL)
        : brouillons[0];

    if (cible) await ouvrirDevis(cible.id);
}

async function ouvrirDevis(id) {
    devisActuel = devis.find(d => d.id === id) || null;
    if (!devisActuel) return;

    const [clients, lignes] = await Promise.all([
        devisActuel.client_id
            ? appelerSupabase(
                "clients?select=*&id=eq." +
                encodeURIComponent(devisActuel.client_id) +
                "&user_id=eq." +
                encodeURIComponent(utilisateurId) +
                "&limit=1"
              )
            : Promise.resolve([]),
        appelerSupabase(
            "lignes_devis?select=*&devis_id=eq." +
            encodeURIComponent(devisActuel.id) +
            "&user_id=eq." +
            encodeURIComponent(utilisateurId) +
            "&order=created_at.asc"
        )
    ]);

    clientActuel =
        Array.isArray(clients) && clients[0] ? clients[0] : null;

    lignesActuelles =
        Array.isArray(lignes) ? lignes : [];

    afficherEditeur();
}

function afficherEditeur() {
    document.getElementById("editeur").style.display = "block";
    document.getElementById("numeroDevis").textContent =
        devisActuel.numero || "—";
    document.getElementById("nomClient").textContent =
        clientActuel?.nom || "—";
    document.getElementById("statutDevis").textContent =
        devisActuel.statut || "—";
    document.getElementById("telephone").value =
        clientActuel?.telephone || "";
    document.getElementById("email").value =
        clientActuel?.email || "";
    document.getElementById("adresse").value =
        clientActuel?.adresse || "";

    const tbody = document.getElementById("lignesDevis");
    tbody.innerHTML = "";

    lignesActuelles.forEach(ligne => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${echapperHTML(ligne.description || "")}</td>
            <td>${nombre(ligne.quantite)}</td>
            <td>${montant(ligne.prix_unitaire_ht)}</td>
            <td>${montant(ligne.total_ht)}</td>
            <td>—</td>
        `;
        tbody.appendChild(tr);
    });

    const totalHT = nombre(devisActuel.total_ht);
    const tauxTVA = nombre(devisActuel.taux_tva);
    const montantTVA = totalHT * tauxTVA / 100;

    document.getElementById("totalHT").textContent =
        montant(totalHT);
    document.getElementById("tauxTVA").textContent =
        tauxTVA.toLocaleString("fr-FR");
    document.getElementById("tva").textContent =
        montant(montantTVA);
    document.getElementById("totalTTC").textContent =
        montant(devisActuel.total_ttc);
}

async function validerDevis() {
    if (!devisActuel) return;

    try {
        const dateValidation = new Date().toISOString();

        await appelerSupabase(
            "devis?id=eq." +
            encodeURIComponent(devisActuel.id) +
            "&user_id=eq." +
            encodeURIComponent(utilisateurId),
            {
                method: "PATCH",
                headers: { "Prefer": "return=minimal" },
                body: JSON.stringify({
                    statut: "Validé",
                    date_validation: dateValidation
                })
            }
        );

        alert("Le devis a été validé.");
        await chargerBrouillons();

    } catch (erreur) {
        console.error(erreur);
        alert("Impossible de valider le devis.\n\n" + erreur.message);
    }
}

function fermerEditeur() {
    devisActuel = null;
    clientActuel = null;
    lignesActuelles = [];
    document.getElementById("editeur").style.display = "none";
}

function voirDevis() {
    if (!devisActuel) return;
    window.location.href =
        "voir-devis.html?numero=" +
        encodeURIComponent(devisActuel.numero || "");
}

document.addEventListener("DOMContentLoaded", async () => {
    try {
        const connecte = await verifierUtilisateur();

        if (!connecte) {
            return;
        }

        await chargerBrouillons();
    } catch (erreur) {
        console.error(erreur);
        alert("Impossible de charger les devis.\n\n" + erreur.message);
    }
});
</script>


</body>

</html>
