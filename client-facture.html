<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votre facture — 321Devis</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--shadow:0 10px 35px rgba(17,24,39,.08)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:960px;margin:0 auto;padding:32px 18px 60px}
    .top-branding{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:850}.logo-321{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:16px;font-weight:900}.company-logo{display:block;max-width:150px;max-height:68px;object-fit:contain}
    .head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}
    h1{margin:0 0 7px;font-size:30px}.muted{color:var(--muted)}
    .badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:800}
    .badge-paid{background:#ecfdf5;color:#15803d}
    .paid-info{margin-top:24px;padding:16px;border-radius:12px;background:#ecfdf5;color:#166534;font-size:15px;font-weight:800}
    .payment-section{clear:both;margin-top:28px;padding-top:26px;border-top:1px solid var(--border)}
    .payment-section h2{margin:0 0 6px;font-size:21px}.payment-intro{margin:0 0 16px;color:var(--muted);font-size:14px}
    .payment-list{display:grid;gap:12px}.payment-card{padding:17px;border:1px solid var(--border);border-radius:13px;background:#f9fafb}
    .payment-card-top{display:flex;align-items:center;justify-content:space-between;gap:16px}.payment-name{font-size:15px;font-weight:850}
    .payment-details{display:grid;gap:7px;margin-top:12px;color:#374151;font-size:14px;line-height:1.5}.payment-details strong{color:var(--text)}
    .payment-note{margin-top:12px;padding:11px 12px;border-radius:9px;background:#fff;color:#4b5563;font-size:13px;white-space:pre-wrap}
    .pay-button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 16px;border-radius:10px;background:var(--blue);color:#fff;text-decoration:none;font-size:14px;font-weight:800;white-space:nowrap}
    .invoice{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:30px}
    .invoice-top{display:flex;justify-content:space-between;gap:30px;padding-bottom:25px;border-bottom:1px solid var(--border)}
    .company h2{margin:0 0 10px}.company p,.client p{margin:4px 0;color:#4b5563}.client{text-align:right}.client strong{display:block;margin-bottom:8px}
    .meta{display:flex;gap:35px;flex-wrap:wrap;margin:24px 0}.meta div{color:var(--muted);font-size:13px}.meta strong{display:block;color:var(--text);font-size:15px;margin-top:5px}
    table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:14px 10px;border-bottom:1px solid var(--border);text-align:left}
    th{font-size:12px;color:var(--muted);text-transform:uppercase}th:nth-child(n+2),td:nth-child(n+2){text-align:right}
    .totals{margin-left:auto;width:330px;margin-top:24px}.row{display:flex;justify-content:space-between;padding:8px 0}.ttc{font-size:20px;font-weight:850;border-top:2px solid #111827;margin-top:8px;padding-top:14px}
    .info{margin-top:24px;padding:15px;border-radius:12px;background:#f9fafb;color:#4b5563;font-size:14px}
    .loading,.error{background:#fff;border:1px solid var(--border);border-radius:18px;padding:50px 20px;text-align:center;box-shadow:var(--shadow);color:var(--muted)}
    .error{color:var(--red)}
    @media(max-width:700px){.wrap{padding:22px 12px 45px}.company-logo{max-width:110px;max-height:52px}.head{display:block}.head .badge{margin-top:12px}.invoice{padding:20px}.invoice-top{display:block}.client{text-align:left;margin-top:25px}.totals{width:100%}table{font-size:13px}th,td{padding:12px 6px}.payment-card-top{display:block}.pay-button{width:100%;margin-top:13px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-branding">
      <div class="brand">
        <span class="logo-321">321</span>
        <span>321Devis</span>
      </div>
      <img
        class="company-logo"
        id="logoEntreprise"
        alt="Logo de l'entreprise"
        style="display:none"
      >
    </div>
    <div id="content"><div class="loading">Chargement de votre facture…</div></div>
  </div>

<script>
const SUPABASE_URL="https://ywmuiqavjdzuaittqesc.supabase.co";
const SUPABASE_KEY="sb_publishable_TiG6CaYzFOPjZ8JJSHRI_w_mZd8Kmpv";

function e(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function euro(v){return new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(Number(v||0))}
function date(v){return v?new Intl.DateTimeFormat("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(v)):"—"}

function lignesPaiement(moyen){
  const lignes=[];
  if(moyen.titulaire_compte)lignes.push(`<div><strong>Titulaire :</strong> ${e(moyen.titulaire_compte)}</div>`);
  if(moyen.iban)lignes.push(`<div><strong>IBAN :</strong> ${e(moyen.iban)}</div>`);
  if(moyen.bic)lignes.push(`<div><strong>BIC :</strong> ${e(moyen.bic)}</div>`);
  if(moyen.ordre_cheque)lignes.push(`<div><strong>Ordre du chèque :</strong> ${e(moyen.ordre_cheque)}</div>`);
  if(moyen.adresse_cheque)lignes.push(`<div><strong>Adresse d’envoi :</strong> ${e(moyen.adresse_cheque)}</div>`);
  return lignes.join("");
}

function moyensPaiementHtml(moyens){
  if(!Array.isArray(moyens)||!moyens.length)return "";

  const cartes=moyens.map(moyen=>{
    const lien=String(moyen.lien_paiement||"");
    const bouton=lien.startsWith("https://")
      ? `<a class="pay-button" href="${e(lien)}" target="_blank" rel="noopener noreferrer">Payer maintenant</a>`
      : "";
    const details=lignesPaiement(moyen);
    const instructions=moyen.instructions
      ? `<div class="payment-note">${e(moyen.instructions)}</div>`
      : "";

    return `<article class="payment-card">
      <div class="payment-card-top">
        <div class="payment-name">${e(moyen.nom_affiche||"Moyen de paiement")}</div>
        ${bouton}
      </div>
      ${details?`<div class="payment-details">${details}</div>`:""}
      ${instructions}
    </article>`;
  }).join("");

  return `<section class="payment-section">
    <h2>Régler cette facture</h2>
    <p class="payment-intro">Choisissez l’un des moyens proposés par votre artisan.</p>
    <div class="payment-list">${cartes}</div>
  </section>`;
}

function publicLogoUrl(path){
  const safePath=String(path||"").split("/").filter(Boolean).map(encodeURIComponent).join("/");
  return safePath?`${SUPABASE_URL}/storage/v1/object/public/logos-entreprises/${safePath}`:"";
}

function afficherLogoEntreprise(path){
  const image=document.getElementById("logoEntreprise");
  const url=publicLogoUrl(path);

  if(!url){
    image.removeAttribute("src");
    image.style.display="none";
    return;
  }

  image.onerror=()=>{image.style.display="none"};
  image.onload=()=>{image.style.display="block"};
  image.src=url;
}

async function rpc(name,body){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{
    method:"POST",
    headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}

async function charger(){
  const content=document.getElementById("content");
  try{
    const token=new URLSearchParams(location.search).get("token");
    if(!token)throw new Error("Lien de facture invalide.");

    const data=await rpc("lire_facture_public",{p_token:token});
    const f=Array.isArray(data)?data[0]:data;
    if(!f)throw new Error("Facture introuvable.");

    let lignes=f.lignes;
    if(typeof lignes==="string"){
      try{lignes=JSON.parse(lignes)}catch(_){lignes=[]}
    }
    if(!Array.isArray(lignes))lignes=[];

    let moyensPaiement=f.moyens_paiement;
    if(typeof moyensPaiement==="string"){
      try{moyensPaiement=JSON.parse(moyensPaiement)}catch(_){moyensPaiement=[]}
    }
    if(!Array.isArray(moyensPaiement))moyensPaiement=[];

    const lignesHtml=lignes.map(l=>`
      <tr>
        <td>${e(l.description)}</td>
        <td>${e(l.quantite)}</td>
        <td>${euro(l.prix_unitaire_ht)}</td>
        <td>${euro(l.total_ht)}</td>
      </tr>`).join("");

    const nomEntreprise=f.nom_entreprise||"Votre artisan";
    const tva=Number(f.taux_tva||0);
    const ht=Number(f.total_ht||0);
    const ttc=Number(f.total_ttc||0);
    const estPayee=String(f.statut||"").toLowerCase().includes("pay");

    afficherLogoEntreprise(f.logo_path);

    content.innerHTML=`
      <div class="head">
        <div><h1>${e(f.numero||"Facture")}</h1><div class="muted">Votre facture</div></div>
        <span class="badge ${estPayee?"badge-paid":""}">${e(f.statut||"Envoyée")}</span>
      </div>

      <section class="invoice">
        <div class="invoice-top">
          <div class="company">
            <h2>${e(nomEntreprise)}</h2>
            ${f.entreprise_adresse?`<p>${e(f.entreprise_adresse)}</p>`:""}
            ${f.entreprise_telephone?`<p>${e(f.entreprise_telephone)}</p>`:""}
            ${f.entreprise_email?`<p>${e(f.entreprise_email)}</p>`:""}
          </div>
          <div class="client">
            <strong>Facturé à</strong>
            <p>${e(f.client_nom||"Client")}</p>
            ${f.client_adresse?`<p>${e(f.client_adresse)}</p>`:""}
          </div>
        </div>

        <div class="meta">
          <div>Date de création<strong>${date(f.date_creation)}</strong></div>
          <div>Facture<strong>${e(f.numero||"—")}</strong></div>
          <div>Statut<strong>${e(f.statut||"—")}</strong></div>
        </div>

        <table>
          <thead><tr><th>Prestation</th><th>Qté</th><th>Prix unitaire HT</th><th>Total HT</th></tr></thead>
          <tbody>${lignesHtml||`<tr><td colspan="4">Aucune prestation.</td></tr>`}</tbody>
        </table>

        <div class="totals">
          <div class="row"><span>Total HT</span><strong>${euro(ht)}</strong></div>
          <div class="row"><span>TVA (${e(tva)} %)</span><strong>${euro(ttc-ht)}</strong></div>
          <div class="row ttc"><span>Total TTC</span><span>${euro(ttc)}</span></div>
        </div>

        ${estPayee?`<div class="paid-info">✓ Facture acquittée — aucun paiement n’est à effectuer.</div>`:""}

        ${estPayee?"":moyensPaiementHtml(moyensPaiement)}

        <div class="info">Cette facture vous a été transmise automatiquement par 321Devis pour votre artisan.</div>
      </section>`;
  }catch(err){
    console.error(err);
    content.innerHTML=`<div class="error"><strong>Impossible d'afficher cette facture.</strong><br><br>${e(err.message||"Lien invalide.")}</div>`;
  }
}
charger();
</script>
</body>
</html>
