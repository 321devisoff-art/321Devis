<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>321Devis - Catalogue</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .box {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
            font-size: 15px;
        }

        input {
            width: 250px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
        }

        button.supprimer {
            background: #dc2626;
        }

        button.modifier {
            background: #6b7280;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border-bottom: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .navigation {
            margin-bottom: 20px;
        }

        .navigation a {
            text-decoration: none;
            color: #2563eb;
            margin-right: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>321Devis</h1>
    <p>1, 2, 3… votre devis est prêt.</p>
</header>

<main>

    <div class="navigation">
        <a href="index.html">← Tableau de bord</a>
        <a href="nouveau-devis.html">Nouveau devis</a>
    </div>

    <div class="box">

        <h2>Catalogue des prestations</h2>

        <p>
            Ajoute ici les prestations et les prix utilisés par l'entreprise.
        </p>

        <input
            type="text"
            id="designation"
            placeholder="Ex : Recherche de fuite"
        >

        <input
            type="number"
            id="prix"
            placeholder="Prix HT"
            step="0.01"
        >

        <select id="unite">
            <option value="forfait">Forfait</option>
            <option value="heure">Heure</option>
            <option value="unité">Unité</option>
            <option value="m²">m²</option>
        </select>

        <button onclick="ajouterPrestation()">
            + Ajouter
        </button>

    </div>

    <div class="box">

        <h2>Prestations enregistrées</h2>

        <table>

            <thead>
                <tr>
                    <th>Prestation</th>
                    <th>Prix HT</th>
                    <th>Unité</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="listePrestations"></tbody>

        </table>

    </div>

</main>

<script>

    const SUPABASE_URL =
        "https://ywmuiqavjdzuaittqesc.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_TiG6CaYzFOPjZ8JJSHRI_w_mZd8Kmpv";

    let catalogue = [];


    async function appelerSupabase(endpoint, options = {}) {

        const reponse = await fetch(
            SUPABASE_URL + "/rest/v1/" + endpoint,
            {
                method: options.method || "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                    ...(options.headers || {})
                },

                body: options.body
            }
        );


        const texte = await reponse.text();

        let donnees = null;


        if (texte) {

            try {

                donnees = JSON.parse(texte);

            } catch (erreur) {

                donnees = texte;

            }

        }


        if (!reponse.ok) {

            console.error(
                "Erreur Supabase :",
                reponse.status,
                donnees
            );


            let message =
                "Erreur Supabase HTTP " +
                reponse.status;


            if (
                donnees &&
                typeof donnees === "object" &&
                donnees.message
            ) {

                message +=
                    " : " +
                    donnees.message;

            }


            throw new Error(message);

        }


        return donnees;

    }


    async function chargerCatalogue() {

        try {

            const donnees =
                await appelerSupabase(
                    "catalogue?select=*&order=created_at.asc"
                );


            catalogue =
                Array.isArray(donnees)
                    ? donnees
                    : [];


            if (catalogue.length === 0) {

                await creerCatalogueParDefaut();

                const nouvellesDonnees =
                    await appelerSupabase(
                        "catalogue?select=*&order=created_at.asc"
                    );


                catalogue =
                    Array.isArray(nouvellesDonnees)
                        ? nouvellesDonnees
                        : [];

            }


            afficherCatalogue();


        } catch (erreur) {

            console.error(
                "Impossible de charger le catalogue :",
                erreur
            );


            alert(
                "Impossible de charger le catalogue depuis Supabase.\n\n" +
                erreur.message
            );

        }

    }


    async function creerCatalogueParDefaut() {

        const prestationsParDefaut = [
            {
                nom: "Déplacement",
                description: null,
                prix_unitaire_ht: 45,
                unite: "forfait",
                actif: true
            },
            {
                nom: "Main-d'œuvre",
                description: null,
                prix_unitaire_ht: 65,
                unite: "heure",
                actif: true
            },
            {
                nom: "Recherche de fuite",
                description: null,
                prix_unitaire_ht: 90,
                unite: "forfait",
                actif: true
            },
            {
                nom: "Remplacement siphon",
                description: null,
                prix_unitaire_ht: 25,
                unite: "unité",
                actif: true
            },
            {
                nom: "Débouchage canalisation",
                description: null,
                prix_unitaire_ht: 120,
                unite: "forfait",
                actif: true
            }
        ];


        await appelerSupabase(
            "catalogue",
            {
                method: "POST",

                headers: {
                    "Prefer": "return=minimal"
                },

                body: JSON.stringify(
                    prestationsParDefaut
                )
            }
        );

    }


    function afficherCatalogue() {

        const liste =
            document.getElementById(
                "listePrestations"
            );


        liste.innerHTML = "";


        if (catalogue.length === 0) {

            liste.innerHTML = `
                <tr>
                    <td colspan="4">
                        Aucune prestation enregistrée.
                    </td>
                </tr>
            `;

            return;

        }


        catalogue.forEach(
            function(prestation, index) {

                const ligne =
                    document.createElement("tr");


                const prix =
                    Number(
                        prestation.prix_unitaire_ht
                    );


                ligne.innerHTML = `
                    <td>${echapperHTML(
                        prestation.nom || ""
                    )}</td>

                    <td>
                        ${
                            Number.isFinite(prix)
                                ? prix.toFixed(2)
                                : "0.00"
                        } €
                    </td>

                    <td>
                        ${echapperHTML(
                            prestation.unite || ""
                        )}
                    </td>

                    <td>

                        <button
                            class="modifier"
                            onclick="modifierPrestation(${index})">
                            Modifier
                        </button>

                        <button
                            class="supprimer"
                            onclick="supprimerPrestation(${index})">
                            Supprimer
                        </button>

                    </td>
                `;


                liste.appendChild(ligne);

            }
        );

    }


    async function ajouterPrestation() {

        const designation =
            document
                .getElementById("designation")
                .value
                .trim();


        const prix =
            parseFloat(
                document
                    .getElementById("prix")
                    .value
            );


        const unite =
            document
                .getElementById("unite")
                .value;


        if (designation === "") {

            alert(
                "Entre le nom de la prestation."
            );

            return;

        }


        if (
            isNaN(prix) ||
            prix < 0
        ) {

            alert(
                "Entre un prix HT valide."
            );

            return;

        }


        try {

            await appelerSupabase(
                "catalogue",
                {
                    method: "POST",

                    headers: {
                        "Prefer":
                            "return=representation"
                    },

                    body: JSON.stringify(
                        {
                            nom:
                                designation,

                            description:
                                null,

                            prix_unitaire_ht:
                                prix,

                            unite:
                                unite,

                            actif:
                                true
                        }
                    )
                }
            );


            document.getElementById(
                "designation"
            ).value = "";


            document.getElementById(
                "prix"
            ).value = "";


            await chargerCatalogue();


        } catch (erreur) {

            alert(
                "La prestation n'a pas pu être ajoutée.\n\n" +
                erreur.message
            );

        }

    }


    async function supprimerPrestation(index) {

        const prestation =
            catalogue[index];


        if (
            !prestation ||
            !prestation.id
        ) {

            alert(
                "Prestation introuvable."
            );

            return;

        }


        const confirmation =
            confirm(
                "Supprimer cette prestation ?"
            );


        if (!confirmation) {

            return;

        }


        try {

            await appelerSupabase(
                "catalogue?id=eq." +
                encodeURIComponent(
                    prestation.id
                ),
                {
                    method: "DELETE",

                    headers: {
                        "Prefer":
                            "return=minimal"
                    }
                }
            );


            await chargerCatalogue();


        } catch (erreur) {

            alert(
                "La prestation n'a pas pu être supprimée.\n\n" +
                erreur.message
            );

        }

    }


    async function modifierPrestation(index) {

        const prestation =
            catalogue[index];


        if (
            !prestation ||
            !prestation.id
        ) {

            alert(
                "Prestation introuvable."
            );

            return;

        }


        const nouveauNom =
            prompt(
                "Nom de la prestation :",
                prestation.nom || ""
            );


        if (
            nouveauNom === null ||
            nouveauNom.trim() === ""
        ) {

            return;

        }


        const nouveauPrix =
            prompt(
                "Prix HT :",
                prestation.prix_unitaire_ht
            );


        if (
            nouveauPrix === null
        ) {

            return;

        }


        const prix =
            parseFloat(
                nouveauPrix
            );


        if (
            isNaN(prix) ||
            prix < 0
        ) {

            alert(
                "Prix invalide."
            );

            return;

        }


        try {

            await appelerSupabase(
                "catalogue?id=eq." +
                encodeURIComponent(
                    prestation.id
                ),
                {
                    method: "PATCH",

                    headers: {
                        "Prefer":
                            "return=minimal"
                    },

                    body: JSON.stringify(
                        {
                            nom:
                                nouveauNom.trim(),

                            prix_unitaire_ht:
                                prix
                        }
                    )
                }
            );


            await chargerCatalogue();


        } catch (erreur) {

            alert(
                "La prestation n'a pas pu être modifiée.\n\n" +
                erreur.message
            );

        }

    }


    function echapperHTML(valeur) {

        return String(
            valeur ?? ""
        )
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    chargerCatalogue();

</script>

</body>
</html>
