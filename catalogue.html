<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>321Devis - Catalogue</title>

    <style>
*{box-sizing:border-box}
:root{--blue:#2864e8;--blue2:#1748ba;--ink:#101828;--muted:#667085;--line:#e5eaf2;--bg:#f5f7fb;--white:#fff;--red:#b42318;--shadow:0 10px 30px rgba(16,24,40,.055)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
header{background:transparent;color:var(--ink);padding:34px 22px 0}.header-inner{max-width:1100px;margin:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}header h1{margin:0;font-size:30px;letter-spacing:-1px}header p{margin:7px 0 0;color:var(--muted);font-size:14px}.compte{font-size:12px;color:var(--muted);text-align:right}
main{max-width:1100px;margin:22px auto 50px;padding:0 22px}.navigation{display:flex;gap:5px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px;margin-bottom:22px;overflow-x:auto}.navigation a{text-decoration:none;color:#475467;margin:0;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap}.navigation a:hover{background:#f2f4f7;color:var(--ink)}
.box{background:#fff;padding:23px;margin-bottom:22px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.box h2{margin:0 0 7px;font-size:19px;letter-spacing:-.3px}.box>p{margin:0 0 18px;color:var(--muted);font-size:13px}
input,select,button{font:inherit}input,select{padding:11px 12px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px;margin:4px 5px 4px 0;background:#fff}input{width:280px}input:focus,select:focus{outline:none;border-color:#84adff;box-shadow:0 0 0 3px #eef4ff}button{cursor:pointer;border:0;border-radius:9px;background:var(--blue);color:#fff;padding:11px 15px;font-size:13px;font-weight:750;margin:4px 5px 4px 0}button:hover{background:var(--blue2)}button.supprimer{background:#fff;color:var(--red);border:1px solid #fecdca}button.modifier{background:#fff;color:#344054;border:1px solid #d0d5dd}
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:16px;border:1px solid var(--line);border-radius:11px;overflow:hidden}th,td{border:0;border-bottom:1px solid var(--line);padding:13px 12px;text-align:left;font-size:13px}tr:last-child td{border-bottom:0}th{background:#f8fafc;color:#667085;font-size:11px;text-transform:uppercase;letter-spacing:.35px}td:nth-child(2){font-weight:750;color:var(--ink)}
@media(max-width:700px){header{padding:25px 14px 0}.header-inner{align-items:flex-start;flex-direction:column}.compte{text-align:left}main{padding:0 14px;margin-top:18px}.box{padding:17px}input,select,.box>button{width:100%;margin:4px 0}table{display:block;overflow-x:auto;white-space:nowrap}header h1{font-size:27px}}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div>
            <h1>321Devis</h1>
            <p>1, 2, 3… votre devis est prêt.</p>
        </div>

        <div
            class="compte"
            id="compteUtilisateur"
        >
            Vérification de la connexion…
        </div>
    </div>
</header>

<main>

    <div class="navigation">
        <a href="index.html">Accueil</a>
        <a href="demandes.html">Demandes</a>
        <a href="validation-devis.html">Devis</a>
        <a href="parametres.html">Paramètres</a>
    </div>

    <div class="box">

        <h2>Catalogue</h2>

        <p>
            Les prestations et prix que 321Devis utilise pour préparer vos devis.
        </p>

        <input
            type="text"
            id="designation"
            placeholder="Ex : Recherche de fuite"
        >

        <input
            type="number"
            id="prix"
            placeholder="Prix HT"
            step="0.01"
        >

        <select id="unite">
            <option value="forfait">Forfait</option>
            <option value="heure">Heure</option>
            <option value="unité">Unité</option>
            <option value="m²">m²</option>
        </select>

        <button onclick="ajouterPrestation()">
            + Ajouter
        </button>

    </div>

    <div class="box">

        <h2>Vos prestations</h2>

        <table>

            <thead>
                <tr>
                    <th>Prestation</th>
                    <th>Prix HT</th>
                    <th>Unité</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="listePrestations"></tbody>

        </table>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://ywmuiqavjdzuaittqesc.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_TiG6CaYzFOPjZ8JJSHRI_w_mZd8Kmpv";

    const clientSupabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    let catalogue = [];
    let utilisateurId = null;
    let accessToken = null;



    async function verifierUtilisateur() {

        const {
            data,
            error
        } = await clientSupabase.auth.getSession();

        if (error) {
            throw error;
        }

        if (
            !data ||
            !data.session ||
            !data.session.user
        ) {
            window.location.href =
                "connexion.html";

            return false;
        }

        utilisateurId =
            data.session.user.id;

        accessToken =
            data.session.access_token;

        document.getElementById(
            "compteUtilisateur"
        ).textContent =
            "Connecté : " +
            (
                data.session.user.email ||
                "Compte utilisateur"
            );

        return true;
    }



    async function appelerSupabase(endpoint, options = {}) {

        if (!accessToken) {

            const connecte =
                await verifierUtilisateur();

            if (!connecte) {
                throw new Error(
                    "Vous devez être connecté."
                );
            }
        }

        const reponse = await fetch(
            SUPABASE_URL + "/rest/v1/" + endpoint,
            {
                method: options.method || "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + accessToken,
                    "Content-Type":
                        "application/json",
                    "Accept":
                        "application/json",
                    ...(options.headers || {})
                },

                body: options.body
            }
        );



        const texte = await reponse.text();

        let donnees = null;



        if (texte) {

            try {

                donnees = JSON.parse(texte);

            } catch (erreur) {

                donnees = texte;

            }

        }



        if (!reponse.ok) {

            console.error(
                "Erreur Supabase :",
                reponse.status,
                donnees
            );



            let message =
                "Erreur Supabase HTTP " +
                reponse.status;



            if (
                donnees &&
                typeof donnees === "object" &&
                donnees.message
            ) {

                message +=
                    " : " +
                    donnees.message;

            }



            throw new Error(message);

        }



        return donnees;

    }



    async function chargerCatalogue() {

        try {

            const donnees =
                await appelerSupabase(
                    "catalogue?select=*&user_id=eq." +
                    encodeURIComponent(
                        utilisateurId
                    ) +
                    "&order=created_at.asc"
                );



            catalogue =
                Array.isArray(donnees)
                    ? donnees
                    : [];



            if (catalogue.length === 0) {

                await creerCatalogueParDefaut();

                const nouvellesDonnees =
                    await appelerSupabase(
                        "catalogue?select=*&user_id=eq." +
                        encodeURIComponent(
                            utilisateurId
                        ) +
                        "&order=created_at.asc"
                    );



                catalogue =
                    Array.isArray(nouvellesDonnees)
                        ? nouvellesDonnees
                        : [];

            }



            afficherCatalogue();



        } catch (erreur) {

            console.error(
                "Impossible de charger le catalogue :",
                erreur
            );



            alert(
                "Impossible de charger le catalogue depuis Supabase.\n\n" +
                erreur.message
            );

        }

    }



    async function creerCatalogueParDefaut() {

        const prestationsParDefaut = [
            {
                user_id: utilisateurId,
                nom: "Déplacement",
                description: null,
                prix_unitaire_ht: 45,
                unite: "forfait",
                actif: true
            },
            {
                user_id: utilisateurId,
                nom: "Main-d'œuvre",
                description: null,
                prix_unitaire_ht: 65,
                unite: "heure",
                actif: true
            },
            {
                user_id: utilisateurId,
                nom: "Recherche de fuite",
                description: null,
                prix_unitaire_ht: 90,
                unite: "forfait",
                actif: true
            },
            {
                user_id: utilisateurId,
                nom: "Remplacement siphon",
                description: null,
                prix_unitaire_ht: 25,
                unite: "unité",
                actif: true
            },
            {
                user_id: utilisateurId,
                nom: "Débouchage canalisation",
                description: null,
                prix_unitaire_ht: 120,
                unite: "forfait",
                actif: true
            }
        ];



        await appelerSupabase(
            "catalogue",
            {
                method: "POST",

                headers: {
                    "Prefer": "return=minimal"
                },

                body: JSON.stringify(
                    prestationsParDefaut
                )
            }
        );

    }



    function afficherCatalogue() {

        const liste =
            document.getElementById(
                "listePrestations"
            );



        liste.innerHTML = "";



        if (catalogue.length === 0) {

            liste.innerHTML = `
                <tr>
                    <td colspan="4">
                        Aucune prestation enregistrée.
                    </td>
                </tr>
            `;

            return;

        }



        catalogue.forEach(
            function(prestation, index) {

                const ligne =
                    document.createElement("tr");



                const prix =
                    Number(
                        prestation.prix_unitaire_ht
                    );



                ligne.innerHTML = `
                    <td>${echapperHTML(
                        prestation.nom || ""
                    )}</td>

                    <td>
                        ${
                            Number.isFinite(prix)
                                ? prix.toFixed(2)
                                : "0.00"
                        } €
                    </td>

                    <td>
                        ${echapperHTML(
                            prestation.unite || ""
                        )}
                    </td>

                    <td>

                        <button
                            class="modifier"
                            onclick="modifierPrestation(${index})">
                            Modifier
                        </button>

                        <button
                            class="supprimer"
                            onclick="supprimerPrestation(${index})">
                            Supprimer
                        </button>

                    </td>
                `;



                liste.appendChild(ligne);

            }
        );

    }



    async function ajouterPrestation() {

        const designation =
            document
                .getElementById("designation")
                .value
                .trim();



        const prix =
            parseFloat(
                document
                    .getElementById("prix")
                    .value
            );



        const unite =
            document
                .getElementById("unite")
                .value;



        if (designation === "") {

            alert(
                "Entre le nom de la prestation."
            );

            return;

        }



        if (
            isNaN(prix) ||
            prix < 0
        ) {

            alert(
                "Entre un prix HT valide."
            );

            return;

        }



        try {

            await appelerSupabase(
                "catalogue",
                {
                    method: "POST",

                    headers: {
                        "Prefer":
                            "return=representation"
                    },

                    body: JSON.stringify(
                        {
                            user_id:
                                utilisateurId,

                            nom:
                                designation,

                            description:
                                null,

                            prix_unitaire_ht:
                                prix,

                            unite:
                                unite,

                            actif:
                                true
                        }
                    )
                }
            );



            document.getElementById(
                "designation"
            ).value = "";



            document.getElementById(
                "prix"
            ).value = "";



            await chargerCatalogue();



        } catch (erreur) {

            alert(
                "La prestation n'a pas pu être ajoutée.\n\n" +
                erreur.message
            );

        }

    }



    async function supprimerPrestation(index) {

        const prestation =
            catalogue[index];



        if (
            !prestation ||
            !prestation.id
        ) {

            alert(
                "Prestation introuvable."
            );

            return;

        }



        const confirmation =
            confirm(
                "Supprimer cette prestation ?"
            );



        if (!confirmation) {

            return;

        }



        try {

            await appelerSupabase(
                "catalogue?id=eq." +
                encodeURIComponent(
                    prestation.id
                ) +
                "&user_id=eq." +
                encodeURIComponent(
                    utilisateurId
                ),
                {
                    method: "DELETE",

                    headers: {
                        "Prefer":
                            "return=minimal"
                    }
                }
            );



            await chargerCatalogue();



        } catch (erreur) {

            alert(
                "La prestation n'a pas pu être supprimée.\n\n" +
                erreur.message
            );

        }

    }



    async function modifierPrestation(index) {

        const prestation =
            catalogue[index];



        if (
            !prestation ||
            !prestation.id
        ) {

            alert(
                "Prestation introuvable."
            );

            return;

        }



        const nouveauNom =
            prompt(
                "Nom de la prestation :",
                prestation.nom || ""
            );



        if (
            nouveauNom === null ||
            nouveauNom.trim() === ""
        ) {

            return;

        }



        const nouveauPrix =
            prompt(
                "Prix HT :",
                prestation.prix_unitaire_ht
            );



        if (
            nouveauPrix === null
        ) {

            return;

        }



        const prix =
            parseFloat(
                nouveauPrix
            );



        if (
            isNaN(prix) ||
            prix < 0
        ) {

            alert(
                "Prix invalide."
            );

            return;

        }



        try {

            await appelerSupabase(
                "catalogue?id=eq." +
                encodeURIComponent(
                    prestation.id
                ) +
                "&user_id=eq." +
                encodeURIComponent(
                    utilisateurId
                ),
                {
                    method: "PATCH",

                    headers: {
                        "Prefer":
                            "return=minimal"
                    },

                    body: JSON.stringify(
                        {
                            nom:
                                nouveauNom.trim(),

                            prix_unitaire_ht:
                                prix
                        }
                    )
                }
            );



            await chargerCatalogue();



        } catch (erreur) {

            alert(
                "La prestation n'a pas pu être modifiée.\n\n" +
                erreur.message
            );

        }

    }



    function echapperHTML(valeur) {

        return String(
            valeur ?? ""
        )
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }



    async function initialiser() {

        try {

            const connecte =
                await verifierUtilisateur();

            if (!connecte) {
                return;
            }

            await chargerCatalogue();

        } catch (erreur) {

            console.error(
                "Erreur d'initialisation :",
                erreur
            );

            alert(
                "Impossible d'initialiser le catalogue.\n\n" +
                (
                    erreur.message ||
                    "Erreur inconnue."
                )
            );
        }
    }



    initialiser();

</script>

</body>
</html>
